<!doctype html>
<html lang="ko" data-role="patient" data-platform="mobile">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#DC2626">
  <title>하루안부 · 긴급</title>

  <link rel="stylesheet" href="../07_디자인/tokens/tokens.css">
  <link rel="stylesheet" href="patient.css">
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.3.0/dist/iconify-icon.min.js"></script>

  <style>
    html, body {
      height: 100%; overflow: hidden;
      background: #FEF2F2;
    }

    /* ── 전체 레이아웃: 2열 가로 ── */
    .sos-wrap {
      height: 100dvh;
      display: grid;
      grid-template-columns: 42% 58%;
    }

    /* ══ LEFT — 히어로 패널 ══ */
    .sos-left {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px 28px;
      background: linear-gradient(160deg, #FEE2E2 0%, #FECACA 100%);
      overflow: hidden;
    }
    /* 배경 orb */
    .sos-left::before {
      content: '';
      position: absolute;
      width: 320px; height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(220,38,38,.18) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* 박동하는 SOS 원 */
    .hero-orb {
      position: relative;
      width: 108px; height: 108px;
      flex-shrink: 0;
    }
    .hero-ring {
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      border: 2px solid rgba(220,38,38,.28);
      animation: sos-ring 2s ease-out infinite;
    }
    .hero-ring:nth-child(2) { inset: -28px; animation-delay: .7s; border-color: rgba(220,38,38,.14); }
    @keyframes sos-ring {
      0%  { opacity: 1;  transform: scale(.85); }
      100%{ opacity: 0;  transform: scale(1.15); }
    }
    .hero-circle {
      position: absolute; inset: 0;
      border-radius: 50%;
      background: #DC2626;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      box-shadow: 0 12px 36px rgba(220,38,38,.45);
      animation: hero-pulse 1.8s ease-in-out infinite;
    }
    @keyframes hero-pulse {
      0%, 100% { box-shadow: 0 12px 36px rgba(220,38,38,.45); transform: scale(1); }
      50%       { box-shadow: 0 16px 48px rgba(220,38,38,.62); transform: scale(1.04); }
    }

    .hero-heading {
      text-align: center;
      position: relative;
    }
    .hero-heading h1 {
      font-size: 32px; font-weight: 900;
      letter-spacing: -0.04em; line-height: 1.1;
      color: #DC2626;
    }
    .hero-heading p {
      font-size: 13.5px; line-height: 1.6;
      color: rgba(0,0,0,.48);
      margin-top: 8px;
    }

    /* ══ RIGHT — 행동 패널 ══ */
    .sos-right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      padding: 24px 28px 24px 20px;
      background: #fff;
    }

    /* 카운트다운 카드 */
    .count-card {
      background: #FEF2F2;
      border: 1px solid rgba(220,38,38,.18);
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-shrink: 0;
    }

    .count-ring {
      position: relative;
      width: 80px; height: 80px;
      flex-shrink: 0;
    }
    .count-ring svg {
      width: 100%; height: 100%;
      transform: rotate(-90deg);
    }
    .count-ring .track {
      fill: none; stroke: rgba(220,38,38,.12); stroke-width: 8;
    }
    .count-ring .fill {
      fill: none; stroke: #DC2626; stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 220;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }
    .count-num {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 900;
      color: #DC2626; letter-spacing: -0.04em;
      line-height: 1;
    }

    .count-text {}
    .count-label {
      font-size: 15px; font-weight: 800;
      color: #111; letter-spacing: -0.3px;
      line-height: 1.3; margin-bottom: 8px;
    }
    .count-items {
      display: flex; flex-direction: column; gap: 5px;
    }
    .count-item {
      display: flex; align-items: center; gap: 7px;
      font-size: 12.5px; color: rgba(0,0,0,.48);
      font-weight: 500;
    }
    .count-item iconify-icon { color: #DC2626; flex-shrink: 0; }

    /* 취소 버튼 */
    .cancel-btn {
      width: 100%;
      height: 68px;
      border: 0; cursor: pointer;
      border-radius: 16px;
      background: #fff;
      border: 1.5px solid rgba(0,0,0,.09);
      color: #111;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font-family: var(--font-family-base);
      font-size: 17px; font-weight: 800;
      letter-spacing: -0.3px;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
      flex-shrink: 0;
      transition: transform .15s, box-shadow .15s;
    }
    .cancel-btn:hover { box-shadow: 0 6px 20px rgba(0,0,0,.12); }
    .cancel-btn:active { transform: scale(.97); }

    /* 빠른 액션 버튼 행 */
    .quick-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex-shrink: 0;
    }
    .quick-btn {
      height: 58px;
      border: 0; cursor: pointer;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-family: var(--font-family-base);
      font-size: 14px; font-weight: 800;
      letter-spacing: -0.2px;
      text-decoration: none;
      transition: transform .15s;
    }
    .quick-btn:active { transform: scale(.97); }
    .quick-btn--119 {
      background: #DC2626;
      color: #fff;
      box-shadow: 0 6px 18px rgba(220,38,38,.4);
    }
    .quick-btn--fam {
      background: #FEF2F2;
      color: #DC2626;
      border: 1.5px solid rgba(220,38,38,.22);
    }
  </style>
</head>
<body>

  <div class="sos-wrap">

    <!-- ══ LEFT ══ -->
    <div class="sos-left">
      <div class="hero-orb" aria-hidden="true">
        <div class="hero-ring"></div>
        <div class="hero-ring"></div>
        <div class="hero-circle">
          <iconify-icon icon="fluent:alert-urgent-24-filled" width="52"></iconify-icon>
        </div>
      </div>

      <div class="hero-heading">
        <h1>긴급<br>도움 요청</h1>
        <p>실수가 아니라면 그대로 두세요.<br>잠시 뒤 119와 가족에게<br>동시에 연락이 갑니다.</p>
      </div>
    </div>

    <!-- ══ RIGHT ══ -->
    <div class="sos-right">

      <section class="count-card" aria-label="긴급 카운트다운">
        <div class="count-ring" aria-hidden="true">
          <svg viewBox="0 0 80 80">
            <circle class="track" cx="40" cy="40" r="35"></circle>
            <circle class="fill" id="ringFill" cx="40" cy="40" r="35"></circle>
          </svg>
          <div class="count-num" id="countNum">5</div>
        </div>
        <div class="count-text">
          <div class="count-label">5초 뒤 자동으로 실행됩니다</div>
          <div class="count-items">
            <div class="count-item">
              <iconify-icon icon="fluent:call-24-filled" width="15"></iconify-icon>
              119 응급 전화 자동 연결
            </div>
            <div class="count-item">
              <iconify-icon icon="fluent:people-community-24-filled" width="15"></iconify-icon>
              민지 · 서연 · 태우에게 위치 공유
            </div>
            <div class="count-item">
              <iconify-icon icon="fluent:location-24-filled" width="15"></iconify-icon>
              현재 위치: 집 (거실)
            </div>
          </div>
        </div>
      </section>

      <button class="cancel-btn" type="button" id="cancelBtn">
        <iconify-icon icon="fluent:dismiss-circle-24-filled" width="22" aria-hidden="true"></iconify-icon>
        실수예요, 취소할게요
      </button>

      <div class="quick-row">
        <a href="#" class="quick-btn quick-btn--119">
          <iconify-icon icon="fluent:call-24-filled" width="18" aria-hidden="true"></iconify-icon>
          119 바로 전화
        </a>
        <a href="p03-call.html" class="quick-btn quick-btn--fam">
          <iconify-icon icon="fluent:people-24-filled" width="18" aria-hidden="true"></iconify-icon>
          가족에게만 연락
        </a>
      </div>

    </div>
  </div>

  <script>
    (function () {
      var CIRCUMFERENCE = 220;
      var total = 5;
      var remain = total;
      var numEl = document.getElementById('countNum');
      var ringEl = document.getElementById('ringFill');
      var cancelBtn = document.getElementById('cancelBtn');
      var timer = null;
      var cancelled = false;

      function tick() {
        remain -= 1;
        if (cancelled) return;
        if (remain <= 0) {
          numEl.textContent = '연결';
          numEl.style.fontSize = '16px';
          ringEl.style.strokeDashoffset = CIRCUMFERENCE;
          return;
        }
        numEl.textContent = remain;
        var ratio = (total - remain) / total;
        ringEl.style.strokeDashoffset = (CIRCUMFERENCE * ratio).toFixed(1);
        timer = setTimeout(tick, 1000);
      }
      timer = setTimeout(tick, 1000);

      cancelBtn.addEventListener('click', function () {
        cancelled = true;
        if (timer) clearTimeout(timer);
        location.href = 'p01-today.html';
      });
    })();
  </script>

</body>
</html>
