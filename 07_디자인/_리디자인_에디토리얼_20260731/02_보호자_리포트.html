<!DOCTYPE html>
<html lang="ko" data-role="guardian" data-platform="mobile">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>에디토리얼 · 보호자 · 일일 리포트</title>
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="_editorial.css">
  <script src="../_iconify-icon.min.js"></script>
</head>
<body>
  <div class="proto-cap"><b>보호자 · AI 일일 리포트</b> — 에디토리얼 프리미엄 리디자인</div>

  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span class="sb">
        <iconify-icon icon="material-symbols:signal-cellular-4-bar"></iconify-icon>
        <iconify-icon icon="material-symbols:wifi"></iconify-icon>
        <iconify-icon icon="material-symbols:battery-full"></iconify-icon>
      </span>
    </div>

    <div class="screen">
      <div class="top">
        <span class="eyebrow">AI 일일 리포트</span>
        <span class="ics">
          <button aria-label="공유"><iconify-icon icon="mingcute:share-2-line"></iconify-icon></button>
        </span>
      </div>

      <h1 class="title">박영자 님의<br>하루</h1>
      <div class="subtitle">7월 31일 목요일 · 오늘 요약</div>

      <div class="trio">
        <div class="c"><div class="n">3<small>/3</small></div><div class="l"><iconify-icon icon="ph:bowl-food-fill"></iconify-icon>식사</div></div>
        <div class="c"><div class="n">2<small>/2</small></div><div class="l"><iconify-icon icon="mingcute:capsule-fill"></iconify-icon>복약</div></div>
        <div class="c"><div class="n">20<small>분</small></div><div class="l"><iconify-icon icon="material-symbols:directions-run-rounded"></iconify-icon>산책</div></div>
      </div>

      <div class="ai">
        <span class="chip"><iconify-icon icon="material-symbols:auto-awesome-rounded"></iconify-icon> AI 요약</span>
        <p>오늘 <b>세 끼를 모두</b> 드시고 <b>산책 20분</b>을 마치셨어요. 오후 혈압이 평소보다 조금 높아, <b>간호사 김서연 님이 확인</b>하고 저녁에 다시 재보기로 했어요.</p>
      </div>

      <div class="sec-label">활력징후 · 최근 7일</div>
      <div>
        <div class="stat">
          <div><div class="sl">혈압</div><div class="sv">128/82 <small>mmHg</small></div></div>
          <svg class="spark2" width="104" height="38" viewBox="0 0 104 38"><polyline points="3,28 20,25 37,27 54,20 71,22 88,15 100,10"/><circle cx="100" cy="10" r="3.2"/></svg>
        </div>
        <div class="stat">
          <div><div class="sl">체온</div><div class="sv">36.7 <small>°C</small></div></div>
          <svg class="spark2" width="104" height="38" viewBox="0 0 104 38"><polyline points="3,22 20,23 37,21 54,25 71,20 88,22 100,18"/><circle cx="100" cy="18" r="3.2"/></svg>
        </div>
      </div>

      <div class="sec-label">오늘의 순간</div>
      <div class="moment">
        <img src="https://picsum.photos/seed/haru-walk-spring/760/620" alt="오전 산책 사진">
        <div class="cap">
          <div class="q">"볕이 좋아서 마당을 한 바퀴 도셨어요."</div>
          <div class="by">간호사 김서연 · 오늘 10:42</div>
        </div>
      </div>
    </div>

    <nav class="tab">
      <a class="on"><iconify-icon icon="mingcute:home-3-fill"></iconify-icon>홈</a>
      <a><iconify-icon icon="mingcute:heartbeat-line"></iconify-icon>건강</a>
      <a><iconify-icon icon="mingcute:chat-1-line"></iconify-icon>소통</a>
      <a><iconify-icon icon="mingcute:user-3-line"></iconify-icon>내 정보</a>
    </nav>
  </div>
</body>
</html>
