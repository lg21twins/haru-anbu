<!DOCTYPE html>
<html lang="ko" data-role="patient" data-platform="mobile">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>에디토리얼 · 환자 · 오늘</title>
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="_editorial.css">
  <script src="../_iconify-icon.min.js"></script>
  <style>
    .mhero { margin-top: 26px; }
    .mhero .mtag { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--acc); }
    .mhero .mt { font-size: 34px; font-weight: 800; letter-spacing: -.03em; margin-top: 12px; color: var(--t1); }
    .mhero .ms { font-size: 17px; color: var(--t2); margin-top: 10px; font-weight: 500; }
    .mhero .mbtns { display: flex; gap: 12px; margin-top: 24px; }
    .mhero .mbtns .big-btn { flex: 1; }
    .fam { display: flex; align-items: center; gap: 14px; padding: 15px 0; }
    .fam + .fam { border-top: 1px solid var(--hair); }
    .fam .fav { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; background: var(--acc-soft); flex: 0 0 auto; }
    .fam .fav img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .fam .fi { flex: 1; }
    .fam .fn { font-size: 19px; font-weight: 750; letter-spacing: -.02em; }
    .fam .fs { font-size: 14px; color: var(--acc); margin-top: 2px; font-weight: 650; }
    .fam .fs.off { color: var(--t3); }
    .fam .fbtn { width: 50px; height: 50px; border-radius: 50%; background: var(--acc); color: #fff; border: 0; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .fam .fbtn iconify-icon { font-size: 24px; }
    .big-btn.help { background: #E5484D; color: #fff; margin-top: 28px; }
    .p-title { font-size: 40px; line-height: 1.08; }
  </style>
</head>
<body>
  <div class="proto-cap"><b>환자 본인앱 · 오늘</b> — 에디토리얼 프리미엄 리디자인</div>

  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span class="sb">
        <iconify-icon icon="material-symbols:signal-cellular-4-bar"></iconify-icon>
        <iconify-icon icon="material-symbols:wifi"></iconify-icon>
        <iconify-icon icon="material-symbols:battery-full"></iconify-icon>
      </span>
    </div>

    <div class="screen">
      <div class="top">
        <span class="eyebrow">오후 2:30 · 토요일</span>
        <span class="ics">
          <a aria-label="설정"><iconify-icon icon="mingcute:settings-3-line"></iconify-icon></a>
        </span>
      </div>

      <h1 class="title p-title">박영자 님,<br>안녕하세요</h1>

      <div class="mhero">
        <div class="mtag">지금 · 오후 2:30</div>
        <div class="mt">약 드실 시간이에요</div>
        <div class="ms">혈압약 · 당뇨약 · 비타민D</div>
        <div class="mbtns">
          <button type="button" class="big-btn primary"><iconify-icon icon="mingcute:check-fill"></iconify-icon>먹었어요</button>
          <button type="button" class="big-btn ghost">아직이요</button>
        </div>
      </div>

      <div class="sec-label">오늘 남은 일정</div>
      <div class="tl">
        <div class="ev up">
          <div class="time">4:00</div>
          <div><div class="task"><span class="st"></span>산책</div><div class="who">공원 30분</div></div>
        </div>
        <div class="ev up">
          <div class="time">5:30</div>
          <div><div class="task"><span class="st"></span>민지와 영상통화</div><div class="who">매주 토요일</div></div>
        </div>
        <div class="ev up">
          <div class="time">6:00</div>
          <div><div class="task"><span class="st"></span>저녁 식사</div></div>
        </div>
      </div>

      <div class="sec-label">가족</div>
      <div>
        <div class="fam">
          <div class="fav"><img src="https://randomuser.me/api/portraits/women/44.jpg" alt="딸 민지"></div>
          <div class="fi"><div class="fn">딸 민지</div><div class="fs">지금 접속 중</div></div>
          <button class="fbtn" aria-label="민지 영상통화"><iconify-icon icon="material-symbols:videocam-rounded"></iconify-icon></button>
        </div>
        <div class="fam">
          <div class="fav"><img src="https://randomuser.me/api/portraits/women/9.jpg" alt="손녀 서연"></div>
          <div class="fi"><div class="fn">손녀 서연</div><div class="fs">지금 접속 중</div></div>
          <button class="fbtn" aria-label="서연 영상통화"><iconify-icon icon="material-symbols:videocam-rounded"></iconify-icon></button>
        </div>
        <div class="fam">
          <div class="fav"><img src="https://randomuser.me/api/portraits/men/32.jpg" alt="아들 태우"></div>
          <div class="fi"><div class="fn">아들 태우</div><div class="fs off">자리 비움</div></div>
          <button class="fbtn" aria-label="태우 음성 메시지" style="background:var(--t3)"><iconify-icon icon="ph:microphone-fill"></iconify-icon></button>
        </div>
      </div>

      <button type="button" class="big-btn help"><iconify-icon icon="ph:hand-waving-fill"></iconify-icon>도움이 필요해요</button>
    </div>

    <nav class="tab">
      <a class="on"><iconify-icon icon="mingcute:home-3-fill"></iconify-icon>오늘</a>
      <a><iconify-icon icon="mingcute:capsule-line"></iconify-icon>약</a>
      <a><iconify-icon icon="material-symbols:family-restroom-rounded"></iconify-icon>가족</a>
      <a><iconify-icon icon="ph:hand-waving-fill"></iconify-icon>도움</a>
    </nav>
  </div>
</body>
</html>
