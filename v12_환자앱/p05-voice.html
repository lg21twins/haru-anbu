<!doctype html>
<html lang="ko" data-role="patient" data-platform="mobile">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="var(--patient-canvas-warm)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>하루안부 · 말벗과 대화</title>

  <link rel="icon" type="image/svg+xml" href="../07_디자인/logo/brand-system/01_심볼단독.svg">
  <link rel="stylesheet" href="../07_디자인/tokens/tokens.css">

  <script src="../07_디자인/_app-theme.js"></script>
  <link rel="stylesheet" href="patient.css">
  <script src="../07_디자인/_iconify-icon.min.js"></script>

  <link rel="stylesheet" href="styles/p05-voice.css">
</head>
<body>

  <div class="app">

    <header class="p-header p-header--nav">
      <a href="p01-today.html" class="p-back" aria-label="뒤로">
        <iconify-icon icon="material-symbols:chevron-left-rounded" width="28" aria-hidden="true"></iconify-icon>
        뒤로
      </a>
      <nav class="top-nav" aria-label="주요 메뉴">
        <a class="nav-tab nav-tab--active" href="p01-today.html" aria-current="page">
          <iconify-icon icon="mingcute:home-1-fill" width="22" aria-hidden="true"></iconify-icon>
          홈
        </a>
        <a class="nav-tab" href="p02-med-alert.html">
          <iconify-icon icon="mingcute:clipboard-fill" width="22" aria-hidden="true"></iconify-icon>
          할일
        </a>
        <a class="nav-tab" href="p03-call.html">
          <iconify-icon icon="material-symbols:family-restroom-rounded" width="22" aria-hidden="true"></iconify-icon>
          가족
        </a>
        <a class="nav-tab" href="p08-help.html">
          <iconify-icon icon="ph:hand-waving-fill" width="22" aria-hidden="true"></iconify-icon>
          도움
        </a>
      </nav>
      <div aria-hidden="true"></div>
    </header>

    <div class="main">

      <!-- 최근 대화 — 말벗 한 마디, 어르신 한 마디 -->
      <section class="convo glass" aria-label="말벗과의 대화">
        <div class="bubble bubble--ai">
          <div class="b-avatar" aria-label="하루안부">
            <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <g transform="translate(50, 50) scale(0.163)">
                <path d="M2521.32 2506.66C1239.65 2657.48 1239.65 1895.6 1239.65 1279.34L2497.69 0.000170058C2518.68 494.198 2522.27 1157.92 1658.86 1262.48C2641.88 1314.25 2521.32 2101.84 2521.32 2506.66Z" fill="white"/>
                <path d="M4.6772 19.3353C1286.35 -131.481 1286.35 630.399 1286.35 1246.66L28.3145 2526C7.32194 2031.8 3.73014 1368.08 867.143 1263.52C-115.881 1211.75 4.6772 424.157 4.6772 19.3353Z" fill="white"/>
              </g>
            </svg>
          </div>
          <div class="b-content">
            <div class="b-who">하루안부</div>
            <div class="b-text">점심은 잘 드셨어요?</div>
          </div>
        </div>

        <div class="bubble bubble--user">
          <div class="b-avatar b-avatar--user" aria-hidden="true">
            <img src="https://randomuser.me/api/portraits/women/79.jpg" alt="">
          </div>
          <div class="b-content">
            <div class="b-who">나</div>
            <div class="b-text">응, 민지가 끓여준 미역국 먹었어. 아주 맛있더라.</div>
          </div>
        </div>


        <div class="bubble bubble--ai">
          <div class="b-avatar" aria-label="하루안부">
            <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <g transform="translate(50, 50) scale(0.163)">
                <path d="M2521.32 2506.66C1239.65 2657.48 1239.65 1895.6 1239.65 1279.34L2497.69 0.000170058C2518.68 494.198 2522.27 1157.92 1658.86 1262.48C2641.88 1314.25 2521.32 2101.84 2521.32 2506.66Z" fill="white"/>
                <path d="M4.6772 19.3353C1286.35 -131.481 1286.35 630.399 1286.35 1246.66L28.3145 2526C7.32194 2031.8 3.73014 1368.08 867.143 1263.52C-115.881 1211.75 4.6772 424.157 4.6772 19.3353Z" fill="white"/>
              </g>
            </svg>
          </div>
          <div class="b-content">
            <div class="b-who">하루안부</div>
            <div class="b-text">오후엔 뭐 하셨어요?<br />창문으로 햇살 따뜻하게 들어오지요.</div>
          </div>
        </div>

      </section>

      <!-- 듣는 중 히어로 -->
      <div class="listening" aria-live="polite">
        <div class="wave" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="listen-status">잘 듣고 있어요</div>
        <div class="listen-hint">천천히 말씀하셔도 돼요. 다 마치셨으면 아래 버튼을 눌러 주세요.</div>
      </div>

      <!-- 액션 -->
      <div class="actions">
        <a href="p01-today.html" class="a-btn a-btn--done" aria-label="대화 마치기">
          <iconify-icon icon="mingcute:check-circle-fill" width="28" aria-hidden="true"></iconify-icon>
          대화 마치기
        </a>
        <button class="a-btn a-btn--stop" type="button" aria-label="그만 말하기 — AI에게 답변 요청">
          <iconify-icon icon="mingcute:mic-off-fill" width="28" aria-hidden="true"></iconify-icon>
          그만 말하기
        </button>
      </div>

    </div>
  </div>

</body>
</html>
