      margin: 0 0 var(--space-3);

    .setting-item {
      display: flex; align-items: center; gap: var(--space-4);

    .setting-label { font-size: var(--text-callout); font-weight: var(--weight-semibold); }

  <main class="app-main">
    <div class="stack-loose" style="padding-top: var(--space-5);">

      <section class="fade-in fade-in--d1">
        <div class="group-title">화면 설정</div>
        <div class="card group-card" style="margin-bottom: var(--space-7);">
          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label">글자 크게</div>
              <div class="setting-desc">본문이 한 단계 더 커져요</div>
            </div>
            <button type="button" id="toggle-text" class="toggle" role="switch" aria-checked="false"></button>
          </div>
          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label">고대비 모드</div>
              <div class="setting-desc">글자와 배경 대비를 강하게 해요 (7:1)</div>
            </div>
            <button type="button" id="toggle-contrast" class="toggle" role="switch" aria-checked="false"></button>
          </div>
        </div>
      </section>

      <section class="fade-in fade-in--d2">
        <div class="group-title">케어 알림</div>
        <div class="card group-card">
          <div class="setting-item">
            <div class="setting-info"><div class="setting-label">긴급 알림</div><div class="setting-desc">SOS, 혈압 이상 등 긴급 상황</div></div>
            <button type="button" class="toggle is-on" role="switch" aria-checked="true" onclick="toggleSwitch(this)"></button>
          </div>
          <div class="setting-item">
            <div class="setting-info"><div class="setting-label">일일 리포트</div><div class="setting-desc">매일 오후 5시 AI 케어 리포트</div></div>
            <button type="button" class="toggle is-on" role="switch" aria-checked="true" onclick="toggleSwitch(this)"></button>
          </div>
          <div class="setting-item">
            <div class="setting-info"><div class="setting-label">투약 완료 알림</div><div class="setting-desc">투약이 완료될 때마다</div></div>
            <button type="button" class="toggle is-on" role="switch" aria-checked="true" onclick="toggleSwitch(this)"></button>
          </div>
          <div class="setting-item">
            <div class="setting-info"><div class="setting-label">식사 기록 알림</div><div class="setting-desc">식사 기록이 업데이트될 때</div></div>
            <button type="button" class="toggle" role="switch" aria-checked="false" onclick="toggleSwitch(this)"></button>
          </div>
        </div>
      </section>

      <section class="fade-in fade-in--d2">
        <div class="group-title">채팅</div>
        <div class="card group-card">
          <div class="setting-item">
            <div class="setting-info"><div class="setting-label">새 메시지 알림</div><div class="setting-desc">간호사로부터 메시지 수신</div></div>
            <button type="button" class="toggle is-on" role="switch" aria-checked="true" onclick="toggleSwitch(this)"></button>
          </div>
          <div class="setting-item">
            <div class="setting-info"><div class="setting-label">소리</div></div>
            <button type="button" class="toggle is-on" role="switch" aria-checked="true" onclick="toggleSwitch(this)"></button>
          </div>
          <div class="setting-item">
            <div class="setting-info"><div class="setting-label">진동</div></div>
            <button type="button" class="toggle is-on" role="switch" aria-checked="true" onclick="toggleSwitch(this)"></button>
          </div>

      </section>

      <section class="fade-in fade-in--d3">

        <div class="card group-card">
          <div class="setting-item">
            <div class="setting-info"><div class="setting-label">처방전 변경 알림</div><div class="setting-desc">처방 내용이 변경될 때</div></div>
            <button type="button" class="toggle is-on" role="switch" aria-checked="true" onclick="toggleSwitch(this)"></button>
          </div>
          <div class="setting-item">
            <div class="setting-info"><div class="setting-label">마케팅 알림</div><div class="setting-desc">이벤트, 공지사항</div></div>
            <button type="button" class="toggle" role="switch" aria-checked="false" onclick="toggleSwitch(this)"></button>
          </div>
        </div>
      </section>

    </div>
  </main>

  <div class="bottom-bar">
    <nav class="tabbar">
      <a href="g-guardian-live.html" class="tab" aria-label="홈"><span class="tab-icon"><iconify-icon icon="fluent:home-24-filled" style="font-size:26px"></iconify-icon></span></a>

      <a href="g05-records.html" class="tab" aria-label="기록"><span class="tab-icon"><iconify-icon icon="fluent:folder-24-filled" style="font-size:26px"></iconify-icon></span></a>

  </div>

</div>
<script>
  function toggleSwitch(btn){
    var on = btn.classList.toggle('is-on');
    btn.setAttribute('aria-checked', on ? 'true' : 'false');
  }

  // ---- v3.2.3 화면 설정 토글 바인딩 (다크는 봉인, 글자크게·고대비만) ----
  (function () {
    const T = window.HaruTheme;
    if (!T) return;

    function syncToggle(btn, on) {
      btn.classList.toggle('is-on', on);
      btn.setAttribute('aria-checked', on ? 'true' : 'false');
    }

    const text     = document.getElementById('toggle-text');
    const contrast = document.getElementById('toggle-contrast');

    syncToggle(text, T.getTextSize() === 'large');
    syncToggle(contrast, T.getContrast() === 'high');

    text.addEventListener('click', () => {
      const next = !text.classList.contains('is-on');
      T.setTextSize(next ? 'large' : 'normal');
      syncToggle(text, next);
    });

    contrast.addEventListener('click', () => {
      const next = !contrast.classList.contains('is-on');
      T.setContrast(next ? 'high' : 'normal');
      syncToggle(contrast, next);
    });
  })();
</script>
</body>
