<!DOCTYPE html>
<html lang="ko" data-role="guardian" data-platform="mobile">
<head>
  <meta charset="UTF-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#EFF6FF">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>하루안부 — 알림</title>
  <link rel="stylesheet" href="../07_디자인/tokens/tokens.css">
  <link rel="stylesheet" href="../07_디자인/system/app.css">
  <link rel="stylesheet" href="../07_디자인/system/components.css">
  <script src="iconify.min.js"></script>
  <style>
    .app-shell { max-width: 430px; margin: 0 auto; }

    /* 진행 중 (대응 중) — danger soft */
    .live-card {
      background: var(--color-danger-soft);
      border: 1px solid rgba(220,38,38,0.18);
      border-radius: var(--radius-card-lg);
      padding: var(--space-6);
    }
    .live-head { display: flex; gap: var(--space-4); align-items: flex-start; }
    .live-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--palette-white);
      color: var(--color-danger);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .live-title { font-size: var(--text-headline); font-weight: var(--weight-bold); color: var(--color-danger); }
    .live-sub { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-2); }
    .live-meta { font-size: var(--text-caption); color: var(--color-text-secondary); }

    .live-steps {
      display: flex; align-items: center; gap: var(--space-2);
      margin-top: var(--space-5);
    }
    .step { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; }
    .step__dot {
      width: 12px; height: 12px; border-radius: var(--radius-pill);
      background: var(--color-border-strong);
    }
    .step--done .step__dot { background: var(--color-success); }
    .step--current .step__dot { background: var(--color-accent); box-shadow: 0 0 0 4px rgba(var(--color-accent-rgb),0.18); }
    .step__time { font-size: 10px; color: var(--color-text-secondary); font-weight: var(--weight-bold); }
    .step__text { font-size: var(--text-mini); color: var(--color-text-primary); }
    .step-line { flex: 1; height: 2px; background: var(--color-border-subtle); align-self: flex-start; margin-top: 5px; }

    /* 피드 */
    .sec-title { font-size: var(--text-headline); font-weight: var(--weight-bold); margin-bottom: var(--space-3); }
    .feed-card { padding: 0; overflow: hidden; }
    .feed-item {
      display: flex; align-items: center; gap: var(--space-3);
      padding: var(--space-4) var(--space-5);
      text-decoration: none; color: inherit;
    }
    .feed-item + .feed-item { border-top: 1px solid var(--color-border-subtle); }
    .feed-icon {
      width: 32px; height: 32px; border-radius: 10px;
      background: var(--color-bg-canvas);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .feed-icon iconify-icon { color: var(--color-text-secondary); font-size: 16px; }
    .feed-icon--alert { background: var(--color-danger-soft); }
    .feed-icon--alert iconify-icon { color: var(--color-danger); }
    .feed-title { font-size: var(--text-callout); font-weight: var(--weight-semibold); }
    .feed-meta { font-size: var(--text-mini); color: var(--color-text-secondary); margin-top: 2px; }
    .feed-time { font-size: var(--text-mini); color: var(--color-text-tertiary); flex-shrink: 0; }
  </style>
</head>
<body>
<div class="app-shell">

  <header class="header-mobile">
    <button class="header-mobile__left" aria-label="뒤로" onclick="history.back()">
      <iconify-icon icon="fluent:chevron-left-24-filled"></iconify-icon>
    </button>
    <h1 class="header-mobile__title">알림</h1>
    <a class="header-mobile__right" href="g07-settings.html" aria-label="알림 설정">
      <iconify-icon icon="fluent:settings-24-filled"></iconify-icon>
    </a>
  </header>

  <main class="app-main">
    <div class="stack-loose" style="padding-top: var(--space-5);">

      <!-- 지금 대응 중 -->
      <section class="live-card fade-in fade-in--d1" aria-label="지금 대응 중인 알림">
        <div class="live-head">
          <span class="live-icon"><iconify-icon icon="fluent:heart-pulse-24-filled"></iconify-icon></span>
          <div style="flex:1">
            <div class="live-title">혈압 이상이 감지됐어요</div>
            <div class="live-sub">
              <span class="badge badge--danger">대응 중</span>
              <span class="live-meta">박영자님 · <strong>150/95 mmHg</strong></span>
            </div>
          </div>
        </div>
        <div class="live-steps">
          <div class="step step--done">
            <span class="step__dot"></span>
            <span class="step__time">2:30</span>
            <span class="step__text">감지</span>
          </div>
          <div class="step-line"></div>
          <div class="step step--done">
            <span class="step__dot"></span>
            <span class="step__time">2:32</span>
            <span class="step__text">간호사 도착</span>
          </div>
          <div class="step-line"></div>
          <div class="step step--current" aria-current="step">
            <span class="step__dot"></span>
            <span class="step__time">2:35</span>
            <span class="step__text">재측정</span>
          </div>
        </div>
        <a href="g03-chat-nurse.html" class="btn btn--primary btn--full" style="margin-top: var(--space-5);">
          <iconify-icon icon="fluent:chat-24-filled"></iconify-icon>김서연 간호사에게 연락
        </a>
      </section>

      <!-- 오늘의 알림 -->
      <section class="fade-in fade-in--d2">
        <div class="sec-title">오늘의 알림</div>
        <div class="card feed-card">
          <a href="#" class="feed-item">
            <span class="feed-icon feed-icon--alert"><iconify-icon icon="fluent:heart-pulse-24-filled"></iconify-icon></span>
            <div style="flex:1"><div class="feed-title">혈압 이상 감지</div><div class="feed-meta">박영자님 · 150/95 mmHg</div></div>
            <span class="feed-time">14:30</span>
          </a>
          <a href="#" class="feed-item">
            <span class="feed-icon"><iconify-icon icon="fluent:food-24-filled"></iconify-icon></span>
            <div style="flex:1"><div class="feed-title">점심 식사 완료</div><div class="feed-meta">90% 드셨어요</div></div>
            <span class="feed-time">13:00</span>
          </a>
          <a href="#" class="feed-item">
            <span class="feed-icon"><iconify-icon icon="fluent:person-walking-20-filled"></iconify-icon></span>
            <div style="flex:1"><div class="feed-title">산책 30분 완료</div><div class="feed-meta">정원 한 바퀴</div></div>
            <span class="feed-time">11:30</span>
          </a>
          <a href="#" class="feed-item">
            <span class="feed-icon"><iconify-icon icon="fluent:pill-24-filled"></iconify-icon></span>
            <div style="flex:1"><div class="feed-title">오전 투약 완료</div><div class="feed-meta">혈압약·당뇨약 2종</div></div>
            <span class="feed-time">9:00</span>
          </a>
          <a href="#" class="feed-item">
            <span class="feed-icon"><iconify-icon icon="fluent:heart-pulse-24-filled"></iconify-icon></span>
            <div style="flex:1"><div class="feed-title">오전 혈압 측정</div><div class="feed-meta">130/85 정상</div></div>
            <span class="feed-time">9:00</span>
          </a>
        </div>
      </section>

    </div>
  </main>

  <div class="bottom-bar">
    <nav class="tabbar">
      <a href="g-guardian-live.html" class="tab" aria-label="홈"><span class="tab-icon"><iconify-icon icon="fluent:home-24-filled" style="font-size:26px"></iconify-icon></span></a>
      <a href="g02-ai-guide.html" class="tab" aria-label="AI 가이드"><span class="tab-icon"><iconify-icon icon="fluent:book-24-filled" style="font-size:26px"></iconify-icon></span></a>
      <a href="g03-sotong.html" class="tab" aria-label="소통"><span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 5.81 2 10.5c0 2.65 1.56 5.02 4 6.56V22l4.34-2.41c.54.07 1.1.11 1.66.11 5.52 0 10-3.81 10-8.5S17.52 2 12 2z"/></svg></span></a>
      <a href="g05-records.html" class="tab" aria-label="기록"><span class="tab-icon"><iconify-icon icon="fluent:folder-24-filled" style="font-size:26px"></iconify-icon></span></a>
      <a href="g05-mypage.html" class="tab active" aria-label="마이"><span class="tab-icon"><iconify-icon icon="fluent:person-24-filled" style="font-size:26px"></iconify-icon></span></a>
    </nav>
    <a href="g-guardian-live.html?chat=1" class="ai-fab" aria-label="AI 어시스턴트">
      <svg width="22" height="22" viewBox="0 0 2526 2526" fill="var(--color-accent)"><path d="M2521.32 2506.66C1239.65 2657.48 1239.65 1895.6 1239.65 1279.34L2497.69 0C2518.68 494.198 2522.27 1157.92 1658.86 1262.48C2641.88 1314.25 2521.32 2101.84 2521.32 2506.66Z"/><path d="M4.677 19.335C1286.35-131.481 1286.35 630.399 1286.35 1246.66L28.315 2526C7.322 2031.8 3.73 1368.08 867.143 1263.52C-115.881 1211.75 4.677 424.157 4.677 19.335Z"/></svg>
    </a>
  </div>

</div>
</body>
</html>
