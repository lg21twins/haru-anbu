<!doctype html>
<html lang="ko" data-role="patient" data-platform="mobile">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF5E8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>하루안부 · 오늘 기분</title>

  <link rel="icon" type="image/svg+xml" href="../07_디자인/logo/brand-system/01_심볼단독.svg">
  <link rel="stylesheet" href="../07_디자인/tokens/tokens.css">
  <link rel="stylesheet" href="patient.css">
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.3.0/dist/iconify-icon.min.js"></script>

  <style>
    .p-header { padding-right: 100px; }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-9);
      min-height: 0;
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }

    .mood-heading h1 {
      font: var(--weight-bold) 44px / 1.15 var(--font-family-base);
      letter-spacing: -0.03em;
    }
    .mood-heading p {
      font: var(--weight-medium) 20px / 1.45 var(--font-family-base);
      color: var(--color-text-secondary);
      margin-top: 12px;
    }

    /* 5개 대형 기분 타일 — 이게 이 화면의 유일한 콘텐츠 */
    .mood-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: var(--space-5);
      width: 100%;
    }

    .mood-btn {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 24px;
      padding: var(--space-7) var(--space-4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-4);
      cursor: pointer;
      min-height: 200px;
      transition: transform var(--motion-micro) var(--easing-standard),
                  border-color var(--motion-micro) var(--easing-standard),
                  background var(--motion-micro) var(--easing-standard),
                  box-shadow var(--motion-micro) var(--easing-standard);
      box-shadow: 0 4px 14px rgba(194, 98, 28, 0.06);
    }
    .mood-btn:hover { transform: translateY(-4px); box-shadow: 0 10px 28px rgba(194, 98, 28, 0.12); }
    .mood-btn:active { transform: scale(0.96); }

    .mood-btn.selected {
      border-color: var(--brand-orange-400);
      background: var(--brand-orange-100);
      box-shadow: 0 10px 28px rgba(251, 146, 60, 0.30);
    }
    .mood-btn.selected .mood-icon { color: var(--brand-orange-600); }
    .mood-btn.selected .mood-label { color: var(--brand-orange-700); }

    .mood-icon { color: var(--palette-gray-400); transition: color var(--motion-micro) var(--easing-standard); }
    .mood-label {
      font: var(--weight-bold) 18px / 1.2 var(--font-family-base);
      letter-spacing: -0.2px;
    }

    /* 저장 확인 토스트 — 기분 선택하면 잠깐 떴다 사라짐 */
    .toast {
      position: fixed;
      bottom: var(--space-8);
      left: 50%;
      transform: translateX(-50%) translateY(24px);
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      border-radius: 16px;
      background: var(--brand-green-600);
      color: #fff;
      font: var(--weight-bold) 17px / 1 var(--font-family-base);
      box-shadow: 0 10px 28px rgba(22, 163, 74, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s var(--easing-standard),
                  transform .25s var(--easing-standard);
      z-index: var(--z-overlay);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 900px) {
      .mood-grid { gap: var(--space-3); }
      .mood-btn { min-height: 140px; padding: var(--space-5) var(--space-2); gap: var(--space-2); }
      .mood-icon { width: 48px !important; }
      .mood-label { font-size: 14px; }
      .mood-heading h1 { font-size: 28px; }
      .mood-heading p { font-size: 17px; }
    }
  </style>
</head>
<body>

  <div class="app">

    <header class="p-header">
      <a href="p01-today.html" class="p-back">
        <iconify-icon icon="fluent:chevron-left-24-filled" width="28" aria-hidden="true"></iconify-icon>
        오늘 홈
      </a>
      <div class="clock">
        <span class="clock-time" style="font-size: 28px;">오후 2:30</span>
      </div>
    </header>

    <div class="main">

      <div class="mood-heading">
        <h1>오늘 기분이 어떠세요?</h1>
        <p>하나만 눌러 주시면 민지에게 바로 알려드려요.</p>
      </div>

      <div class="mood-grid" role="radiogroup" aria-label="기분 선택 — 누르면 바로 저장됩니다">

        <button class="mood-btn" type="button" role="radio" aria-checked="false" data-mood="슬퍼요">
          <iconify-icon class="mood-icon" icon="fluent:emoji-sad-48-regular" width="80" aria-hidden="true"></iconify-icon>
          <span class="mood-label">슬퍼요</span>
        </button>

        <button class="mood-btn" type="button" role="radio" aria-checked="false" data-mood="별로예요">
          <iconify-icon class="mood-icon" icon="fluent:emoji-sad-slight-48-regular" width="80" aria-hidden="true"></iconify-icon>
          <span class="mood-label">별로예요</span>
        </button>

        <button class="mood-btn" type="button" role="radio" aria-checked="false" data-mood="괜찮아요">
          <iconify-icon class="mood-icon" icon="fluent:emoji-48-regular" width="80" aria-hidden="true"></iconify-icon>
          <span class="mood-label">괜찮아요</span>
        </button>

        <button class="mood-btn" type="button" role="radio" aria-checked="false" data-mood="좋아요">
          <iconify-icon class="mood-icon" icon="fluent:emoji-smile-slight-48-regular" width="80" aria-hidden="true"></iconify-icon>
          <span class="mood-label">좋아요</span>
        </button>

        <button class="mood-btn" type="button" role="radio" aria-checked="false" data-mood="아주 좋아요">
          <iconify-icon class="mood-icon" icon="fluent:emoji-laugh-48-regular" width="80" aria-hidden="true"></iconify-icon>
          <span class="mood-label">아주 좋아요</span>
        </button>

      </div>
    </div>
  </div>

  <div class="toast" id="savedToast" role="status" aria-live="polite">
    <iconify-icon icon="fluent:checkmark-circle-24-filled" width="24" aria-hidden="true"></iconify-icon>
    <span id="savedText">저장됐어요. 가족에게 전달됩니다.</span>
  </div>

  <button class="sos-fab" type="button" aria-label="긴급 호출 SOS">
    <iconify-icon icon="fluent:alert-urgent-24-filled" width="30" aria-hidden="true"></iconify-icon>
    <span class="sos-fab-label">긴급</span>
  </button>

  <script>
    // 한 번 터치 = 선택 + 즉시 저장 (토스트)
    var buttons = document.querySelectorAll('.mood-btn');
    var toast = document.getElementById('savedToast');
    var savedText = document.getElementById('savedText');
    var toastTimer;

    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        buttons.forEach(function (b) {
          b.classList.remove('selected');
          b.setAttribute('aria-checked', 'false');
        });
        btn.classList.add('selected');
        btn.setAttribute('aria-checked', 'true');

        var mood = btn.getAttribute('data-mood') || '';
        savedText.textContent = '"' + mood + '" 저장됐어요. 가족에게 전달됩니다.';

        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2800);
      });
    });
  </script>
</body>
</html>
