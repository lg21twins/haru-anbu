<!doctype html>
<html lang="ko" data-role="patient" data-platform="mobile">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF0DC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>하루안부 · 가족에게 전화</title>
  <link rel="icon" type="image/svg+xml" href="../07_디자인/logo/brand-system/01_심볼단독.svg">
  <link rel="stylesheet" href="../07_디자인/tokens/tokens.css">
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.3.0/dist/iconify-icon.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-family-base);
      -webkit-font-smoothing: antialiased;
      color: var(--color-text-primary);
      background: #FFF0DC;
    }
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
      background: linear-gradient(145deg, #FFE4C4 0%, #FFF5E8 45%, #F5EEE4 100%); }
    .bg .g1 { position: absolute; width: 600px; height: 600px; left: 20%; top: -25%;
      border-radius: 50%; background: radial-gradient(circle, rgba(251,146,60,.18) 0%, transparent 65%); filter: blur(60px); }
    .bg .g2 { position: absolute; width: 500px; height: 500px; right: 15%; bottom: -20%;
      border-radius: 50%; background: radial-gradient(circle, rgba(253,186,116,.20) 0%, transparent 65%); filter: blur(50px); }

    .app {
      position: relative; z-index: 1; height: 100dvh;
      display: flex; flex-direction: column;
      padding: 24px 28px 20px; gap: 16px;
    }

    .header { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--color-text-primary); text-decoration: none;
      font-size: 17px; font-weight: 600;
    }
    .clock { font-size: 22px; font-weight: 700; color: var(--color-text-secondary); }

    .glass {
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 28px;
      box-shadow: 0 6px 28px rgba(0,0,0,0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .main { flex: 1; display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 16px; min-height: 0; }

    /* ── 왼쪽: 가족 타일 3개 ── */
    .left { display: flex; flex-direction: column; gap: 0; min-height: 0; }
    .left-inner { flex: 1; padding: 24px 28px; display: flex; flex-direction: column; gap: 0; }
    .section-title { font-size: 20px; font-weight: 700; letter-spacing: -0.2px; margin-bottom: 18px; }

    .family-grid {
      flex: 1;
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .family-tile {
      border-radius: 22px;
      padding: 20px 14px 16px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px;
      text-decoration: none; color: var(--color-text-primary);
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      position: relative;
    }
    .family-tile:hover { transform: translateY(-3px); box-shadow: 0 14px 36px rgba(0,0,0,.11); }
    .family-tile:active { transform: scale(.97); }

    .tile-av {
      width: 88px; height: 88px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 800; color: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,.14);
      position: relative;
    }
    .online-dot {
      position: absolute; bottom: 3px; right: 3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--brand-green-500); border: 3px solid #fff;
    }
    .offline-dot {
      position: absolute; bottom: 3px; right: 3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--palette-gray-300); border: 3px solid #fff;
    }

    .tile-name { font-size: 20px; font-weight: 800; letter-spacing: -0.2px; }
    .tile-relation { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-top: -4px; }
    .tile-status {
      font-size: 12px; font-weight: 700;
      padding: 4px 12px; border-radius: 999px;
    }
    .status-online { background: var(--brand-green-100); color: var(--brand-green-600); }
    .status-offline { background: var(--palette-gray-100); color: var(--palette-gray-500); }

    .tile-call-btn {
      width: 100%; height: 48px; border-radius: 14px;
      border: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 15px; font-weight: 700; color: #fff;
      transition: transform .15s;
    }
    .tile-call-btn:active { transform: scale(.96); }
    .tile-call-btn.active-call {
      background: linear-gradient(135deg, var(--brand-orange-400), var(--brand-orange-600));
      box-shadow: 0 6px 20px rgba(251,146,60,.38);
    }
    .tile-call-btn.inactive-call {
      background: rgba(0,0,0,.08); color: var(--color-text-secondary);
    }

    /* 메시지 남기기 (오프라인 전용) */
    .tile-msg-btn {
      width: 100%; height: 36px; border-radius: 10px;
      border: 1.5px solid rgba(0,0,0,.1); cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 13px; font-weight: 700;
      background: rgba(255,255,255,.7); color: var(--color-text-secondary);
      transition: all .15s;
    }
    .tile-msg-btn:hover { background: rgba(255,255,255,.95); }

    /* ── 오른쪽: 최근 통화 + 메시지 ── */
    .right { display: flex; flex-direction: column; gap: 14px; min-height: 0; }

    .recent-calls { flex: 1; padding: 22px 24px; display: flex; flex-direction: column; min-height: 0; }
    .recent-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; }

    .call-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(0,0,0,.05);
    }
    .call-item:last-child { border-bottom: none; }
    .call-av {
      width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .call-info { flex: 1; min-width: 0; }
    .call-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .call-name { font-size: 15px; font-weight: 700; }
    .call-missed {
      font-size: 11px; font-weight: 700;
      padding: 2px 8px; border-radius: 999px;
      background: #FEE2E2; color: #DC2626;
    }
    .call-meta { font-size: 12px; color: var(--color-text-secondary); font-weight: 500; }
    .call-action {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--brand-orange-100); color: var(--brand-orange-600);
      display: flex; align-items: center; justify-content: center;
      border: 0; cursor: pointer; flex-shrink: 0;
      text-decoration: none; transition: transform .15s;
    }
    .call-action:active { transform: scale(.92); }

    /* 가족 메시지 + 사진 카드 */
    .msg-card { padding: 18px 20px; flex-shrink: 0; }
    .msg-card-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; }

    .msg-bubble {
      background: rgba(251,146,60,.10);
      border: 1px solid rgba(251,146,60,.18);
      border-radius: 16px 16px 16px 4px;
      padding: 12px 14px; margin-bottom: 12px;
    }
    .msg-bubble-name { font-size: 11px; font-weight: 700; color: var(--brand-orange-600); margin-bottom: 4px; }
    .msg-bubble-text { font-size: 14px; font-weight: 500; line-height: 1.5; }
    .msg-bubble-time { font-size: 11px; color: var(--color-text-tertiary); margin-top: 6px; }

    /* 가족 사진 그리드 */
    .photos-title { font-size: 13px; font-weight: 700; color: var(--color-text-secondary); margin-bottom: 8px; }
    .photos-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      margin-bottom: 12px;
    }
    .photo-thumb {
      aspect-ratio: 1; border-radius: 10px;
      background: linear-gradient(135deg, rgba(251,146,60,.12), rgba(253,186,116,.16));
      border: 1px solid rgba(251,146,60,.15);
      display: flex; align-items: center; justify-content: center;
      color: var(--palette-gray-300);
    }

    /* 음성 답장 버튼 */
    .voice-reply-btn {
      width: 100%; height: 42px; border-radius: 12px;
      border: 1.5px solid rgba(251,146,60,.25); cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 13px; font-weight: 700; color: var(--brand-orange-600);
      background: var(--brand-orange-100);
      transition: all .15s;
    }
    .voice-reply-btn:active { transform: scale(.97); }

  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="g1"></div><div class="g2"></div></div>

  <div class="app">
    <header class="header">
      <a href="p01-today.html" class="back-btn">
        <iconify-icon icon="fluent:chevron-left-24-filled" width="28" aria-hidden="true"></iconify-icon>
        오늘 홈
      </a>
      <div class="clock">오후 2:30</div>
    </header>

    <div class="main">

      <!-- 왼쪽: 가족 타일 -->
      <div class="left glass left-inner">
        <div class="section-title">누구와 통화하시겠어요?</div>

        <div class="family-grid">

          <!-- 딸 민지 (온라인) -->
          <div class="family-tile glass">
            <div class="tile-av" style="background: linear-gradient(135deg,#FDBA74,#EA580C);">
              민
              <span class="online-dot"></span>
            </div>
            <div>
              <div class="tile-name">민지</div>
              <div class="tile-relation">딸</div>
            </div>
            <span class="tile-status status-online">지금 접속 중</span>
            <button class="tile-call-btn active-call" type="button">
              <iconify-icon icon="fluent:video-24-filled" width="20" aria-hidden="true"></iconify-icon>
              영상통화
            </button>
          </div>

          <!-- 아들 태우 (오프라인) -->
          <div class="family-tile glass">
            <div class="tile-av" style="background: linear-gradient(135deg,#93C5FD,#2C7AFC);">
              태
              <span class="offline-dot"></span>
            </div>
            <div>
              <div class="tile-name">태우</div>
              <div class="tile-relation">아들</div>
            </div>
            <span class="tile-status status-offline">오전 11:20에 접속</span>
            <button class="tile-call-btn active-call" type="button">
              <iconify-icon icon="fluent:video-24-filled" width="20" aria-hidden="true"></iconify-icon>
              영상통화
            </button>
            <button class="tile-msg-btn" type="button">
              <iconify-icon icon="fluent:chat-24-regular" width="14" aria-hidden="true"></iconify-icon>
              메시지 남기기
            </button>
          </div>

          <!-- 손녀 서연 (온라인) -->
          <div class="family-tile glass">
            <div class="tile-av" style="background: linear-gradient(135deg,#86EFAC,#16A34A);">
              서
              <span class="online-dot"></span>
            </div>
            <div>
              <div class="tile-name">서연</div>
              <div class="tile-relation">손녀</div>
            </div>
            <span class="tile-status status-online">지금 접속 중</span>
            <button class="tile-call-btn active-call" type="button">
              <iconify-icon icon="fluent:video-24-filled" width="20" aria-hidden="true"></iconify-icon>
              영상통화
            </button>
          </div>

        </div>
      </div>

      <!-- 오른쪽: 최근 통화 + 메시지 + 사진 -->
      <div class="right">

        <div class="recent-calls glass">
          <div class="recent-title">최근 통화</div>

          <div class="call-item">
            <div class="call-av" style="background:linear-gradient(135deg,#FDBA74,#EA580C);">민</div>
            <div class="call-info">
              <div class="call-name-row">
                <div class="call-name">민지</div>
              </div>
              <div class="call-meta">오늘 오전 10:12 · 15분</div>
            </div>
            <button class="call-action" type="button" aria-label="민지에게 다시 전화">
              <iconify-icon icon="fluent:video-24-filled" width="20" aria-hidden="true"></iconify-icon>
            </button>
          </div>

          <div class="call-item">
            <div class="call-av" style="background:linear-gradient(135deg,#86EFAC,#16A34A);">서</div>
            <div class="call-info">
              <div class="call-name-row">
                <div class="call-name">서연</div>
                <span class="call-missed">부재중</span>
              </div>
              <div class="call-meta">어제 저녁 7:30 · 받지 못함</div>
            </div>
            <button class="call-action" type="button" aria-label="서연에게 다시 전화">
              <iconify-icon icon="fluent:video-24-filled" width="20" aria-hidden="true"></iconify-icon>
            </button>
          </div>

          <div class="call-item">
            <div class="call-av" style="background:linear-gradient(135deg,#93C5FD,#2C7AFC);">태</div>
            <div class="call-info">
              <div class="call-name-row">
                <div class="call-name">태우</div>
              </div>
              <div class="call-meta">어제 오전 9:05 · 8분</div>
            </div>
            <button class="call-action" type="button" aria-label="태우에게 다시 전화">
              <iconify-icon icon="fluent:video-24-filled" width="20" aria-hidden="true"></iconify-icon>
            </button>
          </div>

        </div>

        <!-- 메시지 + 사진 카드 -->
        <div class="msg-card glass">
          <div class="msg-card-title">민지의 최근 메시지</div>
          <div class="msg-bubble">
            <div class="msg-bubble-name">딸 민지</div>
            <div class="msg-bubble-text">엄마, 오늘 날씨가 좋네요. 점심 드시고 산책 하셨어요?</div>
            <div class="msg-bubble-time">오후 1:45</div>
          </div>

          <div class="photos-title">민지가 보낸 사진</div>
          <div class="photos-grid" role="list" aria-label="가족이 보낸 사진">
            <div class="photo-thumb" role="listitem">
              <iconify-icon icon="fluent:image-24-regular" width="28" aria-hidden="true"></iconify-icon>
            </div>
            <div class="photo-thumb" role="listitem">
              <iconify-icon icon="fluent:image-24-regular" width="28" aria-hidden="true"></iconify-icon>
            </div>
            <div class="photo-thumb" role="listitem">
              <iconify-icon icon="fluent:image-24-regular" width="28" aria-hidden="true"></iconify-icon>
            </div>
            <div class="photo-thumb" role="listitem">
              <iconify-icon icon="fluent:image-24-regular" width="28" aria-hidden="true"></iconify-icon>
            </div>
          </div>

          <button class="voice-reply-btn" type="button">
            <iconify-icon icon="fluent:mic-24-filled" width="18" aria-hidden="true"></iconify-icon>
            음성으로 답장하기
          </button>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
