<!doctype html>
<html lang="ko" data-role="patient" data-platform="mobile">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF0DC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>하루안부 · 오늘</title>

  <link rel="icon" type="image/svg+xml" href="../07_디자인/logo/brand-system/01_심볼단독.svg">
  <link rel="stylesheet" href="../07_디자인/tokens/tokens.css">
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.3.0/dist/iconify-icon.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-family-base);
      -webkit-font-smoothing: antialiased;
      color: var(--color-text-primary);
      background: #FFF0DC;
    }

    .bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
      background: linear-gradient(145deg, #FFE4C4 0%, #FFF5E8 45%, #F5EEE4 100%);
    }
    .bg .g1 {
      position: absolute; width: 700px; height: 700px; left: 20%; top: -30%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(251,146,60,.18) 0%, transparent 65%);
      filter: blur(60px);
    }
    .bg .g2 {
      position: absolute; width: 500px; height: 500px; right: 15%; bottom: -20%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(253,186,116,.20) 0%, transparent 65%);
      filter: blur(50px);
    }

    .app {
      position: relative; z-index: 1;
      height: 100dvh;
      display: flex; flex-direction: column;
      padding: 24px 28px 20px; gap: 16px;
    }

    /* ── 헤더 ── */
    .header {
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 34px; height: 34px; }
    .brand-name { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }

    .header-right { display: flex; align-items: center; gap: 20px; }
    .weather-chip {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 14px; font-weight: 600;
      padding: 7px 14px; border-radius: 999px;
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(255,255,255,.6);
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      color: var(--color-text-secondary);
    }
    .weather-chip iconify-icon { color: #FB923C; }

    .clock { display: flex; align-items: baseline; gap: 10px; }
    .clock-time { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; }
    .clock-date { font-size: 17px; font-weight: 500; color: var(--color-text-secondary); }

    /* ── 메인 2열 ── */
    .main {
      flex: 1;
      display: grid; grid-template-columns: 7fr 3fr;
      gap: 16px; min-height: 0;
    }

    .glass {
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 28px;
      box-shadow: 0 6px 28px rgba(0,0,0,0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* ================================================================
       왼쪽 패널
    ================================================================ */
    .left { display: flex; flex-direction: column; gap: 16px; min-height: 0; }

    /* 가족 카드 */
    .family-card {
      flex: 1; padding: 28px 32px;
      display: flex; flex-direction: column; justify-content: space-between;
      position: relative; overflow: hidden; min-height: 0;
    }
    .family-card::before {
      content: ''; position: absolute; top: -50px; right: -50px;
      width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(251,146,60,.20), transparent 70%);
      border-radius: 50%; pointer-events: none;
    }

    .family-top { display: flex; align-items: center; gap: 18px; }

    .avatar-wrap { position: relative; flex-shrink: 0; }
    .avatar {
      width: 76px; height: 76px; border-radius: 50%;
      background: linear-gradient(135deg, #FDBA74, #EA580C);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 700;
      box-shadow: 0 6px 18px rgba(234,88,12,.28);
    }
    .av-online {
      position: absolute; bottom: 2px; right: 2px;
      width: 22px; height: 22px; border-radius: 50%;
      background: #22C55E; border: 3px solid #fff;
    }

    .family-info { display: flex; flex-direction: column; gap: 6px; }
    .family-from {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 15px; font-weight: 600;
      color: var(--brand-orange-600);
    }
    .msg-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 800;
      padding: 3px 9px; border-radius: 999px;
      background: var(--brand-orange-500); color: #fff;
    }
    .family-name { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }

    .family-msg {
      font-size: 21px; font-weight: 500; line-height: 1.58;
      flex: 1; display: flex; align-items: center; padding: 4px 0;
    }

    .family-btn {
      height: 68px; width: 100%; border-radius: 16px;
      border: 0; cursor: pointer;
      font-size: 19px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: var(--brand-orange-400); color: #fff;
      box-shadow: 0 6px 20px rgba(251,146,60,.38);
      text-decoration: none;
      transition: transform .15s, box-shadow .15s;
    }
    .family-btn:active { transform: scale(.97); box-shadow: 0 3px 10px rgba(251,146,60,.3); }

    /* AI 말벗 카드 */
    .ai-card {
      flex-shrink: 0; padding: 22px 28px;
      display: flex; align-items: center; gap: 20px;
      cursor: pointer; transition: transform .15s;
    }
    .ai-card:active { transform: scale(.98); }
    .ai-icon-wrap {
      width: 64px; height: 64px; border-radius: 20px;
      background: linear-gradient(135deg, var(--brand-orange-300), var(--brand-orange-500));
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(251,146,60,.32);
    }
    .ai-text { flex: 1; }
    .ai-title { font-size: 20px; font-weight: 700; letter-spacing: -0.2px; margin-bottom: 5px; }
    .ai-sub-row { display: flex; align-items: center; gap: 10px; }
    .ai-sub { font-size: 15px; font-weight: 500; color: var(--color-text-secondary); }
    .ai-weather {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 13px; font-weight: 600;
      padding: 3px 10px; border-radius: 999px;
      background: var(--brand-orange-100); color: var(--brand-orange-600);
    }
    .typing-dots { display: inline-flex; align-items: center; gap: 4px; margin-left: 2px; }
    .typing-dots span {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--palette-gray-300);
      animation: tdot 1.4s ease infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .25s; }
    .typing-dots span:nth-child(3) { animation-delay: .5s; }
    @keyframes tdot {
      0%,80%,100% { transform: translateY(0); opacity: .4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }
    .ai-arrow { color: var(--palette-gray-400); flex-shrink: 0; }

    /* ================================================================
       오른쪽 패널
    ================================================================ */
    .right { display: flex; flex-direction: column; gap: 16px; min-height: 0; }

    .fn-grid {
      flex: 1;
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
      gap: 14px; min-height: 0;
    }

    .fn-btn {
      border-radius: 24px; border: 0; cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      text-decoration: none; color: var(--color-text-primary);
      transition: transform .15s, box-shadow .15s;
      position: relative; overflow: hidden; padding: 16px 12px;
    }
    .fn-btn:active { transform: scale(.96); }

    .fn-icon {
      width: 68px; height: 68px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .fn-label { font-size: 18px; font-weight: 700; letter-spacing: -0.2px; }
    .fn-sub { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-top: -4px; }

    /* 영상통화 */
    .fn-call {
      background: rgba(255,255,255,.82); border: 1px solid rgba(255,255,255,.6);
      box-shadow: 0 6px 24px rgba(0,0,0,.07);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .fn-call .fn-icon { background: var(--brand-blue-100); color: var(--brand-blue-500); }
    .fn-online-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 700;
      padding: 4px 10px; border-radius: 999px;
      background: #DCFCE7; color: #16A34A;
      margin-top: -4px;
    }
    .fn-online-dot { width: 7px; height: 7px; border-radius: 50%; background: #22C55E; }

    /* 약 확인 */
    .fn-med {
      background: linear-gradient(145deg, rgba(251,146,60,.88), rgba(234,88,12,.88));
      border: 1px solid rgba(255,200,150,.4);
      box-shadow: 0 8px 28px rgba(251,146,60,.35);
      color: #fff;
    }
    .fn-med .fn-icon { background: rgba(255,255,255,.25); color: #fff; }
    .fn-med .fn-label { color: #fff; }
    .fn-med .fn-sub { color: rgba(255,255,255,.82); }
    .fn-badge {
      position: absolute; top: 14px; right: 14px;
      background: #fff; color: var(--brand-orange-600);
      font-size: 12px; font-weight: 800;
      padding: 4px 10px; border-radius: 999px;
    }
    .fn-streak {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 700;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(255,255,255,.28); color: #fff;
      margin-top: -4px;
    }

    /* 기분 체크 */
    .fn-mood {
      background: rgba(255,255,255,.82); border: 1px solid rgba(255,255,255,.6);
      box-shadow: 0 6px 24px rgba(0,0,0,.07);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .fn-mood .fn-icon { background: var(--brand-orange-100); color: var(--brand-orange-500); }
    .fn-yesterday {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 700;
      padding: 4px 10px; border-radius: 999px;
      background: var(--brand-orange-100); color: var(--brand-orange-600);
      margin-top: -4px;
    }

    /* 오늘 일정 */
    .fn-schedule {
      background: rgba(255,255,255,.82); border: 1px solid rgba(255,255,255,.6);
      box-shadow: 0 6px 24px rgba(0,0,0,.07);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .fn-schedule .fn-icon { background: var(--brand-green-100); color: var(--brand-green-600); }
    .fn-schedule-list {
      display: flex; flex-direction: column; gap: 5px;
      width: 100%; padding: 0 16px;
    }
    .fn-schedule-item {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 600;
      color: var(--color-text-secondary);
    }
    .fn-schedule-item.next {
      color: var(--brand-orange-600); font-weight: 700;
    }
    .fn-schedule-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .fn-next-badge {
      font-size: 10px; font-weight: 800;
      padding: 2px 7px; border-radius: 999px;
      background: var(--brand-orange-100); color: var(--brand-orange-600);
    }

    /* 도움 요청 */
    .help-btn {
      flex-shrink: 0; height: 88px; border-radius: 24px;
      border: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 16px;
      font-size: 24px; font-weight: 800; letter-spacing: -0.3px;
      background: linear-gradient(135deg, #EF4444, #DC2626); color: #fff;
      box-shadow: 0 10px 32px rgba(220,38,38,.38);
      transition: transform .15s, box-shadow .15s;
    }
    .help-btn:active { transform: scale(.97); box-shadow: 0 5px 16px rgba(220,38,38,.3); }
    .help-btn-sub { font-size: 14px; font-weight: 500; opacity: .88; margin-top: 2px; }
    .help-avatars { display: flex; align-items: center; }
    .help-av {
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #fff;
      border: 2.5px solid rgba(255,255,255,.5);
    }
    .help-av:not(:first-child) { margin-left: -11px; }

  </style>
</head>
<body>

  <div class="bg" aria-hidden="true"><div class="g1"></div><div class="g2"></div></div>

  <div class="app">

    <header class="header">
      <div class="brand">
        <img src="../07_디자인/logo/brand-system/01_심볼단독.svg" alt="">
        <span class="brand-name">하루안부</span>
      </div>
      <div class="header-right">
        <div class="weather-chip">
          <iconify-icon icon="fluent:weather-sunny-24-filled" width="18" aria-hidden="true"></iconify-icon>
          맑음 · 산책하기 좋은 날씨예요
        </div>
        <div class="clock">
          <span class="clock-time">오후 2:30</span>
          <span class="clock-date">4월 18일 토요일</span>
        </div>
      </div>
    </header>

    <div class="main">

      <!-- 왼쪽 -->
      <div class="left">

        <div class="family-card glass">
          <div class="family-top">
            <div class="avatar-wrap">
              <div class="avatar">민</div>
              <span class="av-online"></span>
            </div>
            <div class="family-info">
              <div class="family-from">
                <iconify-icon icon="fluent:heart-16-filled" width="16" aria-hidden="true"></iconify-icon>
                딸 민지가 방금 메시지를 보냈어요
                <span class="msg-badge">2건</span>
              </div>
              <div class="family-name">민지</div>
            </div>
          </div>

          <p class="family-msg">
            엄마, 오늘 날씨가 좋네요.<br>
            점심 드시고 산책 한 번 하셨어요?<br>
            저녁에 영상통화 걸게요.
          </p>

          <a href="p03-call.html" class="family-btn">
            <iconify-icon icon="fluent:video-24-filled" width="28" aria-hidden="true"></iconify-icon>
            지금 바로 영상통화 걸기
          </a>
        </div>

        <!-- AI 말벗 -->
        <div class="ai-card glass" role="button" tabindex="0" aria-label="AI 말벗 시작">
          <div class="ai-icon-wrap">
            <iconify-icon icon="fluent:chat-sparkle-24-filled" width="32" style="color:#fff;" aria-hidden="true"></iconify-icon>
          </div>
          <div class="ai-text">
            <div class="ai-title">AI 말벗과 대화하기</div>
            <div class="ai-sub-row">
              <span class="ai-sub">안녕하세요, 오늘도 좋은 하루예요!</span>
              <span class="typing-dots"><span></span><span></span><span></span></span>
            </div>
          </div>
          <iconify-icon class="ai-arrow" icon="fluent:chevron-right-24-filled" width="24" aria-hidden="true"></iconify-icon>
        </div>

      </div>

      <!-- 오른쪽 -->
      <div class="right">

        <div class="fn-grid">

          <!-- 영상통화 -->
          <a href="p03-call.html" class="fn-btn fn-call" aria-label="가족 영상통화">
            <div class="fn-icon">
              <iconify-icon icon="fluent:video-24-filled" width="36" aria-hidden="true"></iconify-icon>
            </div>
            <div class="fn-label">영상통화</div>
            <div class="fn-online-badge">
              <span class="fn-online-dot"></span>민지 접속 중
            </div>
          </a>

          <!-- 약 확인 -->
          <a href="p02-med-alert.html" class="fn-btn fn-med" aria-label="약 먹을 시간 확인">
            <span class="fn-badge">지금</span>
            <div class="fn-icon">
              <iconify-icon icon="fluent:pill-24-filled" width="36" aria-hidden="true"></iconify-icon>
            </div>
            <div class="fn-label">약 먹기</div>
            <div class="fn-streak">
              <iconify-icon icon="fluent:calendar-checkmark-24-filled" width="14" aria-hidden="true"></iconify-icon>
              이번 달 14/15
            </div>
          </a>

          <!-- 기분 체크 -->
          <a href="p04-mood.html" class="fn-btn fn-mood" aria-label="오늘 기분 체크">
            <div class="fn-icon">
              <iconify-icon icon="fluent:emoji-24-regular" width="36" aria-hidden="true"></iconify-icon>
            </div>
            <div class="fn-label">기분 체크</div>
            <div class="fn-yesterday">
              <iconify-icon icon="fluent:history-24-regular" width="13" aria-hidden="true"></iconify-icon>
              어제: 좋음
            </div>
          </a>

          <!-- 오늘 일정 -->
          <button class="fn-btn fn-schedule" type="button" aria-label="오늘 일정 보기">
            <div class="fn-icon">
              <iconify-icon icon="fluent:calendar-24-filled" width="36" aria-hidden="true"></iconify-icon>
            </div>
            <div class="fn-label">오늘 일정</div>
            <div class="fn-schedule-list">
              <div class="fn-schedule-item">
                <span class="fn-schedule-dot" style="background:#22C55E;"></span>
                오전 8:00 아침 식사
              </div>
              <div class="fn-schedule-item">
                <span class="fn-schedule-dot" style="background:#FB923C;"></span>
                오후 2:30 약 복용
              </div>
              <div class="fn-schedule-item next">
                <span class="fn-schedule-dot" style="background:#FB923C;"></span>
                <span class="fn-next-badge">다음</span>오후 4:00 산책
              </div>
            </div>
          </button>

        </div>

        <!-- 도움 요청 -->
        <button class="help-btn" type="button" aria-label="도움 요청">
          <div class="help-avatars" aria-hidden="true">
            <div class="help-av" style="background:linear-gradient(135deg,#FDBA74,#EA580C);">민</div>
            <div class="help-av" style="background:linear-gradient(135deg,#93C5FD,#2C7AFC);">태</div>
            <div class="help-av" style="background:linear-gradient(135deg,#86EFAC,#16A34A);">서</div>
          </div>
          <iconify-icon icon="fluent:hand-wave-24-filled" width="36" aria-hidden="true"></iconify-icon>
          <div>
            <div>도움이 필요해요</div>
            <div class="help-btn-sub">누르면 보호자에게 바로 알려드려요</div>
          </div>
        </button>

      </div>
    </div>
  </div>


</body>
</html>
