<!doctype html>
<html lang="ko" data-role="patient" data-platform="mobile">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF0DC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>하루안부 · 약 먹기</title>
  <link rel="icon" type="image/svg+xml" href="../07_디자인/logo/brand-system/01_심볼단독.svg">
  <link rel="stylesheet" href="../07_디자인/tokens/tokens.css">
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.3.0/dist/iconify-icon.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-family-base);
      -webkit-font-smoothing: antialiased;
      color: var(--color-text-primary);
      background: #FFF0DC;
    }
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
      background: linear-gradient(145deg, #FFE4C4 0%, #FFF5E8 45%, #F5EEE4 100%); }
    .bg .g1 { position: absolute; width: 600px; height: 600px; left: 15%; top: -20%;
      border-radius: 50%; background: radial-gradient(circle, rgba(251,146,60,.20) 0%, transparent 65%); filter: blur(60px); }
    .bg .g2 { position: absolute; width: 500px; height: 500px; right: 10%; bottom: -20%;
      border-radius: 50%; background: radial-gradient(circle, rgba(253,186,116,.22) 0%, transparent 65%); filter: blur(50px); }

    .app {
      position: relative; z-index: 1; height: 100dvh;
      display: flex; flex-direction: column;
      padding: 24px 28px 20px; gap: 16px;
    }

    .header { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--color-text-primary); text-decoration: none;
      font-size: 17px; font-weight: 600;
    }
    .clock { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--color-text-secondary); }

    .glass {
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 28px;
      box-shadow: 0 6px 28px rgba(0,0,0,0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; min-height: 0; }

    /* ── 왼쪽: 알림 히어로 ── */
    .hero {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; padding: 32px;
      text-align: center; position: relative; overflow: hidden;
    }
    .hero::before {
      content: ''; position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(251,146,60,.22), transparent 70%);
      border-radius: 50%; pointer-events: none;
    }

    /* SVG 도넛 링 + 아이콘 래퍼 */
    .hero-ring-wrap {
      position: relative; width: 192px; height: 192px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .ring-svg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      transform: rotate(-90deg);
    }
    .ring-bg { fill: none; stroke: rgba(255,255,255,.25); stroke-width: 7; }
    .ring-fill {
      fill: none; stroke: rgba(255,255,255,.95); stroke-width: 7;
      stroke-dasharray: 268 289; stroke-linecap: round;
      transition: stroke-dasharray .6s ease;
    }

    .hero-icon {
      width: 148px; height: 148px; border-radius: 50%;
      background: linear-gradient(135deg, var(--brand-orange-400), var(--brand-orange-600));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 16px 48px rgba(251,146,60,.42);
      animation: bounce 2s ease-in-out infinite;
      position: relative; z-index: 1;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    .ring-pct-badge {
      position: absolute; bottom: 4px; right: 6px;
      font-size: 12px; font-weight: 800;
      padding: 4px 10px; border-radius: 999px;
      background: #fff; color: var(--brand-orange-600);
      box-shadow: 0 2px 10px rgba(0,0,0,.14);
      z-index: 2;
    }

    .hero-time {
      font-size: 17px; font-weight: 700; color: var(--brand-orange-600);
      background: var(--brand-orange-100); padding: 7px 18px; border-radius: 999px;
      position: relative; z-index: 1;
    }
    .hero-title { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; position: relative; z-index: 1; }
    .hero-sub { font-size: 17px; font-weight: 500; color: var(--color-text-secondary); line-height: 1.5; position: relative; z-index: 1; }

    /* ── 오른쪽: 약 목록 + 버튼 ── */
    .right { display: flex; flex-direction: column; gap: 14px; min-height: 0; }

    .med-list { flex: 1; padding: 24px 28px; display: flex; flex-direction: column; gap: 0; min-height: 0; overflow: hidden; }
    .med-list-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .med-list-title {
      font-size: 18px; font-weight: 700;
      display: flex; align-items: center; gap: 8px;
    }
    .med-count {
      font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 999px;
      background: var(--brand-orange-100); color: var(--brand-orange-600);
    }

    /* 복약 스트릭 배너 */
    .streak-banner {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 14px;
      background: linear-gradient(135deg, rgba(251,146,60,.12), rgba(234,88,12,.08));
      border: 1px solid rgba(251,146,60,.18);
      margin-bottom: 14px; flex-shrink: 0;
    }
    .streak-banner span { font-size: 14px; font-weight: 600; color: var(--brand-orange-700); }
    .streak-banner strong { font-weight: 800; }

    .med-item {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .med-item:last-child { border-bottom: none; }
    .med-icon {
      width: 52px; height: 52px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .med-info { flex: 1; min-width: 0; }
    .med-name { font-size: 17px; font-weight: 700; margin-bottom: 3px; }
    .med-dose { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); }
    .med-instructions {
      display: flex; align-items: center; gap: 10px; margin-top: 5px;
    }
    .med-instr {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600;
      padding: 3px 9px; border-radius: 999px;
      background: rgba(0,0,0,.05); color: var(--color-text-secondary);
    }
    .med-check {
      width: 32px; height: 32px; border-radius: 50%;
      border: 2.5px solid var(--palette-gray-300);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .med-check.done { background: var(--brand-green-500); border-color: var(--brand-green-500); }

    /* 액션 버튼 */
    .action-done {
      height: 84px; border-radius: 22px; border: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 14px;
      font-size: 24px; font-weight: 800; letter-spacing: -0.3px;
      background: linear-gradient(135deg, var(--brand-green-500), var(--brand-green-600));
      color: #fff;
      box-shadow: 0 10px 32px rgba(22,163,74,.36);
      transition: transform .15s;
    }
    .action-done:active { transform: scale(.97); }

    .action-later {
      height: 60px; border-radius: 18px; border: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      font-size: 17px; font-weight: 700;
      background: rgba(255,255,255,.85);
      border: 1.5px solid rgba(0,0,0,.07);
      color: var(--color-text-primary);
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
      transition: transform .15s;
    }
    .action-later:active { transform: scale(.97); }

  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="g1"></div><div class="g2"></div></div>

  <div class="app">
    <header class="header">
      <a href="p01-today.html" class="back-btn">
        <iconify-icon icon="fluent:chevron-left-24-filled" width="28" aria-hidden="true"></iconify-icon>
        오늘 홈
      </a>
      <div class="clock">오후 2:30</div>
    </header>

    <div class="main">

      <!-- 왼쪽: 알림 히어로 -->
      <div class="hero glass">

        <!-- 복약 달성률 도넛 링 -->
        <div class="hero-ring-wrap">
          <svg class="ring-svg" viewBox="0 0 100 100" aria-label="이번 달 복약 달성률 93%">
            <circle class="ring-bg" cx="50" cy="50" r="46"/>
            <circle class="ring-fill" cx="50" cy="50" r="46"/>
          </svg>
          <div class="hero-icon">
            <iconify-icon icon="fluent:pill-48-filled" width="80" style="color:#fff" aria-hidden="true"></iconify-icon>
          </div>
          <div class="ring-pct-badge">93%</div>
        </div>

        <div class="hero-time">오후 2:30 · 지금 드세요</div>
        <h1 class="hero-title">약 드실 시간이에요</h1>
        <p class="hero-sub">물 한 컵과 함께<br>아래 약을 드세요.</p>
      </div>

      <!-- 오른쪽: 약 목록 + 버튼 -->
      <div class="right">

        <div class="med-list glass">
          <div class="med-list-header">
            <div class="med-list-title">
              오늘 오후 약
              <span class="med-count">3가지</span>
            </div>
          </div>

          <!-- 복약 스트릭 배너 -->
          <div class="streak-banner">
            <iconify-icon icon="fluent:fire-24-filled" width="20" style="color:#FB923C;" aria-hidden="true"></iconify-icon>
            <span>연속 <strong>14일</strong> 빠짐없이 복용 중이에요</span>
          </div>

          <div class="med-item">
            <div class="med-icon" style="background:#DBEAFE;">
              <iconify-icon icon="fluent:pill-24-filled" width="26" style="color:#2C7AFC;" aria-hidden="true"></iconify-icon>
            </div>
            <div class="med-info">
              <div class="med-name">혈압약 (아모디핀)</div>
              <div class="med-dose">1정 · 식후 30분</div>
              <div class="med-instructions">
                <span class="med-instr">
                  <iconify-icon icon="fluent:drink-bottle-24-regular" width="12" aria-hidden="true"></iconify-icon>
                  물 한 컵
                </span>
                <span class="med-instr">
                  <iconify-icon icon="fluent:food-24-regular" width="12" aria-hidden="true"></iconify-icon>
                  식후 30분
                </span>
              </div>
            </div>
            <div class="med-check done">
              <iconify-icon icon="fluent:checkmark-16-filled" width="16" style="color:#fff;" aria-hidden="true"></iconify-icon>
            </div>
          </div>

          <div class="med-item">
            <div class="med-icon" style="background:#FEF3C7;">
              <iconify-icon icon="fluent:pill-24-filled" width="26" style="color:#D97706;" aria-hidden="true"></iconify-icon>
            </div>
            <div class="med-info">
              <div class="med-name">당뇨약 (메트포르민)</div>
              <div class="med-dose">1정 · 식사 중 복용</div>
              <div class="med-instructions">
                <span class="med-instr">
                  <iconify-icon icon="fluent:food-24-regular" width="12" aria-hidden="true"></iconify-icon>
                  식사 중
                </span>
                <span class="med-instr">
                  <iconify-icon icon="fluent:drink-bottle-24-regular" width="12" aria-hidden="true"></iconify-icon>
                  물과 함께
                </span>
              </div>
            </div>
            <div class="med-check" onclick="this.classList.toggle('done')">
              <iconify-icon icon="fluent:checkmark-16-filled" width="16" style="color:transparent;" aria-hidden="true"></iconify-icon>
            </div>
          </div>

          <div class="med-item">
            <div class="med-icon" style="background:#F0FDF4;">
              <iconify-icon icon="fluent:drop-24-filled" width="26" style="color:#16A34A;" aria-hidden="true"></iconify-icon>
            </div>
            <div class="med-info">
              <div class="med-name">비타민 D</div>
              <div class="med-dose">1캡슐 · 식후</div>
              <div class="med-instructions">
                <span class="med-instr">
                  <iconify-icon icon="fluent:food-24-regular" width="12" aria-hidden="true"></iconify-icon>
                  식후
                </span>
                <span class="med-instr">
                  <iconify-icon icon="fluent:drink-bottle-24-regular" width="12" aria-hidden="true"></iconify-icon>
                  물과 함께
                </span>
              </div>
            </div>
            <div class="med-check" onclick="this.classList.toggle('done')">
              <iconify-icon icon="fluent:checkmark-16-filled" width="16" style="color:transparent;" aria-hidden="true"></iconify-icon>
            </div>
          </div>
        </div>

        <button class="action-done" type="button">
          <iconify-icon icon="fluent:checkmark-circle-24-filled" width="40" aria-hidden="true"></iconify-icon>
          모두 먹었어요
        </button>

        <button class="action-later" type="button">
          <iconify-icon icon="fluent:clock-24-filled" width="26" aria-hidden="true"></iconify-icon>
          10분 뒤에 다시 알려줘요
        </button>

      </div>
    </div>
  </div>


  <script>
    // 복약 체크박스 아이콘 가시성 토글
    document.querySelectorAll('.med-check').forEach(function(el) {
      el.addEventListener('click', function() {
        var icon = this.querySelector('iconify-icon');
        if (this.classList.contains('done')) {
          icon.style.color = '#fff';
        } else {
          icon.style.color = 'transparent';
        }
      });
    });
  </script>
</body>
</html>
