<!doctype html>
<html lang="ko" data-role="patient" data-platform="mobile">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF0DC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>하루안부 · 오늘 기분</title>
  <link rel="icon" type="image/svg+xml" href="../07_디자인/logo/brand-system/01_심볼단독.svg">
  <link rel="stylesheet" href="../07_디자인/tokens/tokens.css">
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.3.0/dist/iconify-icon.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-family-base);
      -webkit-font-smoothing: antialiased;
      color: var(--color-text-primary);
      background: #FFF0DC;
    }
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
      background: linear-gradient(145deg, #FFE4C4 0%, #FFF5E8 45%, #F5EEE4 100%); }
    .bg .g1 { position: absolute; width: 600px; height: 600px; left: 20%; top: -20%;
      border-radius: 50%; background: radial-gradient(circle, rgba(251,146,60,.18) 0%, transparent 65%); filter: blur(60px); }
    .bg .g2 { position: absolute; width: 500px; height: 500px; right: 10%; bottom: -20%;
      border-radius: 50%; background: radial-gradient(circle, rgba(253,186,116,.20) 0%, transparent 65%); filter: blur(50px); }

    .app {
      position: relative; z-index: 1; height: 100dvh;
      display: flex; flex-direction: column;
      padding: 24px 28px 20px; gap: 16px;
    }

    .header { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--color-text-primary); text-decoration: none;
      font-size: 17px; font-weight: 600;
    }
    .clock { font-size: 22px; font-weight: 700; color: var(--color-text-secondary); }

    .glass {
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 28px;
      box-shadow: 0 6px 28px rgba(0,0,0,0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .main { flex: 1; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 16px; min-height: 0; }

    /* ── 왼쪽: 기분 선택 ── */
    .left { padding: 24px 28px; display: flex; flex-direction: column; gap: 0; min-height: 0; }
    .section-title { font-size: 20px; font-weight: 700; letter-spacing: -0.2px; margin-bottom: 5px; }
    .section-sub { font-size: 15px; color: var(--color-text-secondary); font-weight: 500; margin-bottom: 18px; }

    .mood-grid {
      flex: 1;
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 10px; min-height: 0;
    }

    .mood-btn {
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,.7);
      background: rgba(255,255,255,.65);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px; cursor: pointer;
      transition: transform .15s, border-color .15s, background .15s;
    }
    .mood-btn:hover { transform: translateY(-3px); }
    .mood-btn:active { transform: scale(.96); }
    .mood-btn.selected {
      border-color: var(--brand-orange-400);
      background: var(--brand-orange-100);
    }
    .mood-btn.selected .mood-icon { color: var(--brand-orange-600); }
    .mood-icon { color: var(--palette-gray-400); }
    .mood-label { font-size: 14px; font-weight: 700; }

    /* 이유 선택 */
    .reason-section { margin-top: 14px; flex-shrink: 0; }
    .reason-title { font-size: 14px; font-weight: 700; color: var(--color-text-secondary); margin-bottom: 10px; }
    .reason-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .reason-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 999px;
      font-size: 14px; font-weight: 600;
      background: rgba(255,255,255,.65);
      border: 1.5px solid rgba(0,0,0,.08);
      cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .reason-chip.selected {
      background: var(--brand-orange-100);
      border-color: var(--brand-orange-300);
      color: var(--brand-orange-700);
    }

    /* 저장 버튼 */
    .save-btn {
      margin-top: 14px; flex-shrink: 0;
      height: 68px; border-radius: 18px; border: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      font-size: 20px; font-weight: 800;
      background: linear-gradient(135deg, var(--brand-orange-400), var(--brand-orange-600));
      color: #fff;
      box-shadow: 0 8px 28px rgba(251,146,60,.38);
      transition: transform .15s;
    }
    .save-btn:active { transform: scale(.97); }

    /* ── 오른쪽 ── */
    .right { display: flex; flex-direction: column; gap: 13px; min-height: 0; overflow: hidden; }

    /* 이번 주 기분 히스토리 */
    .week-card { flex: 1; padding: 20px 22px; display: flex; flex-direction: column; min-height: 0; }
    .week-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; }

    .week-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; flex: 1;
    }
    .week-day {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 6px;
      background: rgba(255,255,255,.65);
      border: 1px solid rgba(255,255,255,.6);
      border-radius: 14px; padding: 10px 3px;
    }
    .week-day.today {
      background: var(--brand-orange-100);
      border-color: var(--brand-orange-300);
    }
    .week-day.empty .day-icon { color: var(--palette-gray-200); }
    .day-label { font-size: 11px; font-weight: 700; color: var(--color-text-secondary); }
    .week-day.today .day-label { color: var(--brand-orange-600); }
    .day-icon { color: var(--brand-orange-400); }

    /* AI 코멘트 */
    .ai-comment { padding: 18px 20px; flex-shrink: 0; }
    .ai-comment-inner { display: flex; align-items: flex-start; gap: 12px; }
    .ai-dot {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(135deg, var(--brand-orange-300), var(--brand-orange-500));
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .ai-comment-text { flex: 1; }
    .ai-comment-label { font-size: 11px; font-weight: 700; color: var(--brand-orange-600); margin-bottom: 5px; }
    .ai-comment-body { font-size: 14px; font-weight: 500; line-height: 1.55; }
    .ai-trend {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; font-weight: 700;
      padding: 3px 9px; border-radius: 999px;
      background: #DCFCE7; color: #16A34A;
      margin-top: 8px;
    }

    /* 가족 공유 토글 */
    .share-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; flex-shrink: 0;
    }
    .share-label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
    .share-label iconify-icon { color: var(--brand-orange-500); }

    .toggle-wrap { position: relative; display: inline-block; width: 48px; height: 28px; }
    .toggle-wrap input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0; cursor: pointer;
      background: var(--palette-gray-200); border-radius: 999px;
      transition: background .2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute;
      width: 22px; height: 22px; border-radius: 50%;
      left: 3px; top: 3px;
      background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.15);
      transition: transform .2s;
    }
    .toggle-wrap input:checked + .toggle-slider { background: var(--brand-orange-400); }
    .toggle-wrap input:checked + .toggle-slider::before { transform: translateX(20px); }

    /* 몸 상태 체크 */
    .body-check { padding: 16px 20px; flex-shrink: 0; }
    .body-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
    .body-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .body-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 13px; border-radius: 999px;
      font-size: 13px; font-weight: 600;
      background: rgba(255,255,255,.65);
      border: 1.5px solid rgba(0,0,0,.08);
      cursor: pointer; transition: all .15s;
    }
    .body-chip.selected {
      background: var(--brand-orange-400);
      border-color: transparent; color: #fff;
    }
    .body-chip iconify-icon { font-size: 15px; }

    /* 통증 부위 서브칩 (숨김) */
    .pain-subs {
      display: none; flex-wrap: wrap; gap: 6px;
      width: 100%; padding-top: 8px;
    }
    .pain-subs.visible { display: flex; }
    .pain-sub-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 11px; border-radius: 999px;
      font-size: 12px; font-weight: 600;
      background: #FEE2E2; border: 1.5px solid #FECACA;
      color: #DC2626; cursor: pointer; transition: all .15s;
    }
    .pain-sub-chip.selected { background: #DC2626; border-color: transparent; color: #fff; }

  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="g1"></div><div class="g2"></div></div>

  <div class="app">
    <header class="header">
      <a href="p01-today.html" class="back-btn">
        <iconify-icon icon="fluent:chevron-left-24-filled" width="28" aria-hidden="true"></iconify-icon>
        오늘 홈
      </a>
      <div class="clock">오후 2:30</div>
    </header>

    <div class="main">

      <!-- 왼쪽: 기분 선택 -->
      <div class="left glass">
        <div class="section-title">오늘 기분이 어떠세요?</div>
        <div class="section-sub">버튼 하나만 눌러 주시면 민지에게 바로 알려드려요.</div>

        <div class="mood-grid" role="radiogroup" aria-label="기분 선택">
          <button class="mood-btn" type="button" role="radio" aria-checked="false">
            <iconify-icon class="mood-icon" icon="fluent:emoji-sad-48-regular" width="60" aria-hidden="true"></iconify-icon>
            <span class="mood-label">슬퍼요</span>
          </button>
          <button class="mood-btn" type="button" role="radio" aria-checked="false">
            <iconify-icon class="mood-icon" icon="fluent:emoji-sad-slight-48-regular" width="60" aria-hidden="true"></iconify-icon>
            <span class="mood-label">별로예요</span>
          </button>
          <button class="mood-btn selected" type="button" role="radio" aria-checked="true">
            <iconify-icon class="mood-icon" icon="fluent:emoji-48-regular" width="60" aria-hidden="true"></iconify-icon>
            <span class="mood-label">괜찮아요</span>
          </button>
          <button class="mood-btn" type="button" role="radio" aria-checked="false">
            <iconify-icon class="mood-icon" icon="fluent:emoji-smile-slight-48-regular" width="60" aria-hidden="true"></iconify-icon>
            <span class="mood-label">좋아요</span>
          </button>
          <button class="mood-btn" type="button" role="radio" aria-checked="false">
            <iconify-icon class="mood-icon" icon="fluent:emoji-laugh-48-regular" width="60" aria-hidden="true"></iconify-icon>
            <span class="mood-label">아주 좋아요</span>
          </button>
        </div>

        <!-- 이유 선택 -->
        <div class="reason-section">
          <div class="reason-title">왜 그러세요? (선택)</div>
          <div class="reason-chips">
            <button class="reason-chip" type="button">
              <iconify-icon icon="fluent:people-24-regular" width="16" aria-hidden="true"></iconify-icon>
              가족이 보고 싶어요
            </button>
            <button class="reason-chip selected" type="button">
              <iconify-icon icon="fluent:weather-sunny-16-filled" width="16" aria-hidden="true"></iconify-icon>
              날씨가 좋아요
            </button>
            <button class="reason-chip" type="button">
              <iconify-icon icon="fluent:sleep-24-regular" width="16" aria-hidden="true"></iconify-icon>
              잠을 잘 잤어요
            </button>
            <button class="reason-chip" type="button">
              <iconify-icon icon="fluent:person-heart-24-regular" width="16" aria-hidden="true"></iconify-icon>
              외로워요
            </button>
            <button class="reason-chip" type="button">
              <iconify-icon icon="fluent:pain-24-regular" width="16" aria-hidden="true"></iconify-icon>
              몸이 불편해요
            </button>
          </div>
        </div>

        <button class="save-btn" type="button">
          <iconify-icon icon="fluent:checkmark-circle-24-filled" width="28" aria-hidden="true"></iconify-icon>
          기분 저장하기
        </button>
      </div>

      <!-- 오른쪽 -->
      <div class="right">

        <!-- 이번 주 기록 -->
        <div class="week-card glass">
          <div class="week-title">이번 주 기분 기록</div>
          <div class="week-grid">
            <div class="week-day">
              <div class="day-label">월</div>
              <iconify-icon class="day-icon" icon="fluent:emoji-smile-slight-24-filled" width="26" aria-hidden="true"></iconify-icon>
            </div>
            <div class="week-day">
              <div class="day-label">화</div>
              <iconify-icon class="day-icon" icon="fluent:emoji-24-filled" width="26" aria-hidden="true"></iconify-icon>
            </div>
            <div class="week-day">
              <div class="day-label">수</div>
              <iconify-icon class="day-icon" icon="fluent:emoji-sad-slight-24-filled" width="26" aria-hidden="true"></iconify-icon>
            </div>
            <div class="week-day">
              <div class="day-label">목</div>
              <iconify-icon class="day-icon" icon="fluent:emoji-smile-slight-24-filled" width="26" aria-hidden="true"></iconify-icon>
            </div>
            <div class="week-day">
              <div class="day-label">금</div>
              <iconify-icon class="day-icon" icon="fluent:emoji-laugh-24-filled" width="26" aria-hidden="true"></iconify-icon>
            </div>
            <div class="week-day today">
              <div class="day-label">오늘</div>
              <iconify-icon class="day-icon" icon="fluent:emoji-24-filled" width="26" aria-hidden="true"></iconify-icon>
            </div>
            <div class="week-day empty">
              <div class="day-label">일</div>
              <iconify-icon class="day-icon" icon="fluent:circle-24-regular" width="26" aria-hidden="true"></iconify-icon>
            </div>
          </div>
        </div>

        <!-- AI 코멘트 -->
        <div class="ai-comment glass">
          <div class="ai-comment-inner">
            <div class="ai-dot">
              <iconify-icon icon="fluent:chat-sparkle-24-filled" width="20" style="color:#fff;" aria-hidden="true"></iconify-icon>
            </div>
            <div class="ai-comment-text">
              <div class="ai-comment-label">AI 말벗 코멘트</div>
              <div class="ai-comment-body">이번 주 평균 기분이 좋네요. 어머니, 오늘도 수고하셨어요.</div>
              <div class="ai-trend">
                <iconify-icon icon="fluent:arrow-trending-up-24-filled" width="14" aria-hidden="true"></iconify-icon>
                지난주보다 기분이 0.4 높아요
              </div>
            </div>
          </div>
        </div>

        <!-- 가족 공유 토글 -->
        <div class="share-row glass">
          <div class="share-label">
            <iconify-icon icon="fluent:share-24-regular" width="18" aria-hidden="true"></iconify-icon>
            기분을 가족에게 공유하기
          </div>
          <label class="toggle-wrap" aria-label="가족 공유 토글">
            <input type="checkbox" role="switch" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>

        <!-- 몸 상태 체크 -->
        <div class="body-check glass">
          <div class="body-title">오늘 몸 상태 (여러 개 선택 가능)</div>
          <div class="body-chips" id="bodyChips">
            <button class="body-chip selected" type="button" data-chip="sleep">
              <iconify-icon icon="fluent:checkmark-circle-16-filled" width="15" aria-hidden="true"></iconify-icon>
              잘 잤어요
            </button>
            <button class="body-chip" type="button" data-chip="appetite">
              <iconify-icon icon="fluent:weather-sunny-16-filled" width="15" aria-hidden="true"></iconify-icon>
              식욕이 좋아요
            </button>
            <button class="body-chip" type="button" data-chip="mobility">
              <iconify-icon icon="fluent:person-walking-16-filled" width="15" aria-hidden="true"></iconify-icon>
              거동이 불편해요
            </button>
            <button class="body-chip" type="button" data-chip="pain" id="painChip">
              <iconify-icon icon="fluent:pain-24-regular" width="15" aria-hidden="true"></iconify-icon>
              어딘가 아파요
            </button>
            <button class="body-chip" type="button" data-chip="water">
              <iconify-icon icon="fluent:drop-24-filled" width="15" aria-hidden="true"></iconify-icon>
              물을 잘 마셨어요
            </button>

            <!-- 통증 부위 서브칩 -->
            <div class="pain-subs" id="painSubs" aria-live="polite">
              <button class="pain-sub-chip" type="button">
                <iconify-icon icon="fluent:brain-24-regular" width="13" aria-hidden="true"></iconify-icon>
                머리
              </button>
              <button class="pain-sub-chip" type="button">
                <iconify-icon icon="fluent:heart-pulse-24-regular" width="13" aria-hidden="true"></iconify-icon>
                배
              </button>
              <button class="pain-sub-chip" type="button">
                <iconify-icon icon="fluent:accessibility-24-regular" width="13" aria-hidden="true"></iconify-icon>
                관절
              </button>
              <button class="pain-sub-chip" type="button">
                <iconify-icon icon="fluent:breathing-24-regular" width="13" aria-hidden="true"></iconify-icon>
                호흡
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>


  <script>
    // 기분 버튼 단일 선택
    document.querySelectorAll('.mood-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.mood-btn').forEach(function(b) {
          b.classList.remove('selected');
          b.setAttribute('aria-checked', 'false');
        });
        this.classList.add('selected');
        this.setAttribute('aria-checked', 'true');
      });
    });

    // 이유 칩 토글
    document.querySelectorAll('.reason-chip').forEach(function(chip) {
      chip.addEventListener('click', function() {
        this.classList.toggle('selected');
      });
    });

    // 몸 상태 칩 토글 + 통증 부위 서브칩
    document.querySelectorAll('.body-chip').forEach(function(chip) {
      chip.addEventListener('click', function() {
        this.classList.toggle('selected');
        if (this.id === 'painChip') {
          var subs = document.getElementById('painSubs');
          if (this.classList.contains('selected')) {
            subs.classList.add('visible');
          } else {
            subs.classList.remove('visible');
            subs.querySelectorAll('.pain-sub-chip').forEach(function(s) {
              s.classList.remove('selected');
            });
          }
        }
      });
    });

    // 통증 부위 서브칩 토글
    document.querySelectorAll('.pain-sub-chip').forEach(function(chip) {
      chip.addEventListener('click', function(e) {
        e.stopPropagation();
        this.classList.toggle('selected');
      });
    });
  </script>
</body>
</html>
