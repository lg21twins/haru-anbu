<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>하루안부 · 환자 태블릿 앱 (v12) — 쇼케이스</title>
  <link rel="icon" type="image/svg+xml" href="../07_디자인/logo/brand-system/01_심볼단독.svg">
  <link rel="stylesheet" href="../07_디자인/tokens/tokens.css">
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.3.0/dist/iconify-icon.min.js"></script>
  <style>
    html { background: #F5F0EA; }
    body {
      min-height: 100dvh;
      background: linear-gradient(180deg, #FFEDD5 0%, #FFF7ED 30%, #F5F0EA 100%);
      padding: var(--space-9) var(--space-7) var(--space-11);
    }

    .showcase-head {
      max-width: 1200px;
      margin: 0 auto var(--space-9);
      display: flex;
      align-items: center;
      gap: var(--space-5);
    }
    .showcase-head img { width: 56px; height: 56px; }
    .showcase-head .title {
      font: var(--weight-bold) var(--font-32) / 1.2 var(--font-family-base);
      letter-spacing: -0.02em;
      margin: 0;
    }
    .showcase-head .sub {
      font: var(--weight-medium) var(--text-body-lg) / 1.3 var(--font-family-base);
      color: var(--color-text-secondary);
      margin-top: 4px;
    }

    .screens {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-8);
    }
    .screen-card {
      background: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: var(--radius-hero);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
      transition: transform var(--motion-transition) var(--easing-standard),
                  box-shadow var(--motion-transition) var(--easing-standard);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }
    .screen-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 28px 72px rgba(0,0,0,0.14);
    }
    .screen-meta {
      padding: var(--space-6) var(--space-7);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--space-5);
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .screen-meta .id {
      font: var(--weight-bold) var(--text-caption) / 1 var(--font-family-base);
      letter-spacing: 0.08em;
      color: var(--brand-orange-600);
      background: var(--brand-orange-100);
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      text-transform: uppercase;
    }
    .screen-meta h2 {
      font: var(--weight-bold) var(--text-title) / 1.2 var(--font-family-base);
      margin: 6px 0 4px;
    }
    .screen-meta p {
      font: var(--weight-medium) var(--text-body) / 1.4 var(--font-family-base);
      color: var(--color-text-secondary);
      margin: 0;
      max-width: 360px;
    }
    .screen-frame {
      background: #FDF8F0;
      padding: var(--space-6);
      aspect-ratio: 4 / 3;
      overflow: hidden;
      position: relative;
    }
    .screen-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: var(--radius-card-lg);
      box-shadow: 0 8px 28px rgba(0,0,0,0.08);
      background: #FFF;
      transform: scale(0.5);
      transform-origin: top left;
      width: 200%;
      height: 200%;
    }
    .open-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font: var(--weight-bold) var(--text-callout) / 1 var(--font-family-base);
      color: var(--brand-orange-600);
    }

    @media (max-width: 900px) {
      .screens { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="showcase-head">
    <img src="../07_디자인/logo/brand-system/01_심볼단독.svg" alt="">
    <div>
      <h1 class="title">하루안부 · 환자 태블릿 앱 (v12)</h1>
      <div class="sub">거치형 iPad 10" · Galaxy Tab A — 큰 글자 · 큰 버튼 · 한 번에 한 가지 정보</div>
    </div>
  </header>

  <section class="screens">

    <a href="p01-today.html" target="_blank" class="screen-card">
      <div class="screen-meta">
        <div>
          <span class="id">P-01</span>
          <h2>오늘</h2>
          <p>가족 메시지 + 약·식사·기분 — 거치 상태에서 항상 보이는 홈</p>
        </div>
        <span class="open-btn">
          열기
          <iconify-icon icon="fluent:open-16-filled" width="18" aria-hidden="true"></iconify-icon>
        </span>
      </div>
      <div class="screen-frame">
        <iframe src="p01-today.html" loading="lazy" tabindex="-1" aria-hidden="true"></iframe>
      </div>
    </a>

    <a href="p02-med-alert.html" target="_blank" class="screen-card">
      <div class="screen-meta">
        <div>
          <span class="id">P-02</span>
          <h2>약 드실 시간</h2>
          <p>풀스크린 알림 — 아이콘, 시간, 약 이름, 2개 버튼만</p>
        </div>
        <span class="open-btn">
          열기
          <iconify-icon icon="fluent:open-16-filled" width="18" aria-hidden="true"></iconify-icon>
        </span>
      </div>
      <div class="screen-frame">
        <iframe src="p02-med-alert.html" loading="lazy" tabindex="-1" aria-hidden="true"></iframe>
      </div>
    </a>

    <a href="p03-call.html" target="_blank" class="screen-card">
      <div class="screen-meta">
        <div>
          <span class="id">P-03</span>
          <h2>가족에게 전화</h2>
          <p>얼굴 3명 초대형 타일 — 한 번 눌러 영상통화</p>
        </div>
        <span class="open-btn">
          열기
          <iconify-icon icon="fluent:open-16-filled" width="18" aria-hidden="true"></iconify-icon>
        </span>
      </div>
      <div class="screen-frame">
        <iframe src="p03-call.html" loading="lazy" tabindex="-1" aria-hidden="true"></iframe>
      </div>
    </a>

    <a href="p04-mood.html" target="_blank" class="screen-card">
      <div class="screen-meta">
        <div>
          <span class="id">P-04</span>
          <h2>오늘 기분</h2>
          <p>대형 5단계 기분 타일 + 이번 주 기록</p>
        </div>
        <span class="open-btn">
          열기
          <iconify-icon icon="fluent:open-16-filled" width="18" aria-hidden="true"></iconify-icon>
        </span>
      </div>
      <div class="screen-frame">
        <iframe src="p04-mood.html" loading="lazy" tabindex="-1" aria-hidden="true"></iframe>
      </div>
    </a>

  </section>

</body>
</html>
