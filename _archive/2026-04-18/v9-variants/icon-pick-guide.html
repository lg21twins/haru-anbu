<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 케어 가이드 아이콘 선택</title>
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.3.0/dist/iconify-icon.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Pretendard Variable', sans-serif;
    background: #F0F4F8;
    min-height: 100vh;
    padding: 32px 20px 60px;
  }
  h2 {
    font-size: 20px;
    font-weight: 700;
    color: #1C1C1E;
    margin-bottom: 6px;
  }
  .sub {
    font-size: 13px;
    color: #8E8E93;
    margin-bottom: 28px;
  }

  /* 탭바 미리보기 */
  .preview-section {
    background: #fff;
    border-radius: 20px;
    padding: 20px 16px;
    margin-bottom: 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  }
  .preview-label {
    font-size: 12px;
    font-weight: 600;
    color: #8E8E93;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 14px;
  }
  .tabbar-demo {
    display: flex;
    align-items: center;
    justify-content: space-around;
    background: rgba(210,225,250,.55);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.6);
    border-radius: 999px;
    height: 56px;
    padding: 0 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
    max-width: 340px;
    margin: 0 auto;
  }
  .tab-demo {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    color: rgba(28,28,30,.35);
    cursor: pointer;
    border-radius: 999px;
    transition: all .15s;
  }
  .tab-demo.active { color: #2C7AFC; }
  .tab-demo svg { width: 24px; height: 24px; fill: currentColor; }

  /* 아이콘 그리드 */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .icon-card {
    background: #fff;
    border-radius: 18px;
    padding: 18px 10px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    border: 2.5px solid transparent;
    box-shadow: 0 1px 6px rgba(0,0,0,.06);
    transition: all .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-card:active { transform: scale(.95); }
  .icon-card.selected {
    border-color: #2C7AFC;
    background: rgba(44,122,252,.06);
  }
  .icon-card iconify-icon {
    font-size: 28px;
    color: #2C7AFC;
    transition: color .15s;
  }
  .icon-card.unselected iconify-icon { color: #8E8E93; }
  .icon-name {
    font-size: 11px;
    font-weight: 600;
    color: #1C1C1E;
    text-align: center;
    line-height: 1.3;
  }
  .icon-card.unselected .icon-name { color: #8E8E93; }
  .badge {
    font-size: 10px;
    background: rgba(44,122,252,.12);
    color: #2C7AFC;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 99px;
  }
  .icon-card.unselected .badge { display: none; }

  /* 적용 버튼 */
  .apply-btn {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    left: 50%;
    transform: translateX(-50%);
    background: #2C7AFC;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    padding: 14px 40px;
    box-shadow: 0 4px 20px rgba(44,122,252,.35);
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .apply-btn:active { transform: translateX(-50%) scale(.96); }

  .copied-toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: #1C1C1E;
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    padding: 10px 20px;
    border-radius: 99px;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
    white-space: nowrap;
  }
  .copied-toast.show { opacity: 1; }
</style>
</head>
<body>

<h2>AI 케어 가이드 아이콘</h2>
<p class="sub">탭에 적용할 아이콘을 골라보세요</p>

<!-- 탭바 라이브 프리뷰 -->
<div class="preview-section">
  <div class="preview-label">탭바 미리보기</div>
  <div class="tabbar-demo">
    <!-- 홈 -->
    <div class="tab-demo">
      <iconify-icon icon="fluent:home-24-filled" style="font-size:24px"></iconify-icon>
    </div>
    <!-- AI 가이드 - 동적 -->
    <div class="tab-demo active" id="previewTab">
      <iconify-icon id="previewIcon" icon="fluent:stethoscope-20-filled" style="font-size:24px"></iconify-icon>
    </div>
    <!-- 소통 -->
    <div class="tab-demo">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 5.81 2 10.5c0 2.65 1.56 5.02 4 6.56V22l4.34-2.41c.54.07 1.1.11 1.66.11 5.52 0 10-3.81 10-8.5S17.52 2 12 2z"/></svg>
    </div>
    <!-- 기록 -->
    <div class="tab-demo">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
    </div>
    <!-- 마이페이지 -->
    <div class="tab-demo">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5"/><path d="M4 20c0-3.31 3.58-6 8-6s8 2.69 8 6H4z"/></svg>
    </div>
  </div>
</div>

<!-- 아이콘 선택 그리드 -->
<div class="grid" id="iconGrid">
</div>

<button class="apply-btn" id="applyBtn" onclick="copyIcon()">이 아이콘으로 결정!</button>
<div class="copied-toast" id="toast">아이콘 이름이 복사됐어요 ✓</div>

<script>
const ICONS = [
  { id: 'stethoscope', icon: 'fluent:stethoscope-20-filled',     label: '청진기',       badge: '현재' },
  { id: 'bot',         icon: 'fluent:bot-24-filled',              label: 'AI 봇',        badge: '' },
  { id: 'lightbulb',   icon: 'fluent:lightbulb-24-filled',        label: '전구\n팁/조언', badge: '추천' },
  { id: 'bookstar',    icon: 'fluent:book-star-24-filled',         label: '가이드북',     badge: '' },
  { id: 'heartpulse',  icon: 'fluent:heart-pulse-24-filled',       label: '심박\n케어',   badge: '' },
  { id: 'shield',      icon: 'fluent:shield-checkmark-24-filled',  label: '보호\n안심',   badge: '' },
  { id: 'brain',       icon: 'fluent:brain-circuit-24-filled',     label: 'AI 두뇌',     badge: '' },
  { id: 'chatsparkle', icon: 'fluent:chat-sparkle-24-filled',      label: 'AI 채팅',     badge: '' },
  { id: 'sparkle',     icon: 'fluent:sparkle-24-filled',           label: '스파클\nAI',  badge: '' },
  { id: 'health',      icon: 'fluent:health-24-filled',            label: '건강',         badge: '' },
  { id: 'notepad',     icon: 'fluent:notepad-person-24-filled',    label: '케어노트',     badge: '' },
  { id: 'wand',        icon: 'fluent:wand-24-filled',              label: '마법봉\nAI',   badge: '' },
];

let selected = 'stethoscope';

function render() {
  const grid = document.getElementById('iconGrid');
  grid.innerHTML = ICONS.map(item => `
    <div class="icon-card ${item.id === selected ? 'selected' : 'unselected'}"
         onclick="select('${item.id}', '${item.icon}')">
      <iconify-icon icon="${item.icon}"></iconify-icon>
      <div class="icon-name">${item.label}</div>
      ${item.badge ? `<div class="badge">${item.badge}</div>` : ''}
    </div>
  `).join('');
}

function select(id, icon) {
  selected = id;
  document.getElementById('previewIcon').setAttribute('icon', icon);
  render();
}

function copyIcon() {
  const item = ICONS.find(i => i.id === selected);
  navigator.clipboard.writeText(item.icon).catch(() => {});
  const toast = document.getElementById('toast');
  document.getElementById('applyBtn').textContent = item.label.replace('\n','') + ' 선택 완료 ✓';
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

render();
</script>
</body>
</html>
