<!doctype html>
<html lang="ko" data-role="patient" data-platform="mobile">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#DC2626">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- v3.2.4 P6 5중 표현 — iOS Critical Alert + Android Full-Screen Intent 메타 -->
  <meta name="ios-critical-alert" content="enabled">
  <meta name="android-fullscreen-intent" content="enabled">
  <meta name="haru-alert-tier" content="3">
  <title>하루안부 · 긴급</title>

  <link rel="icon" type="image/svg+xml" href="../07_디자인/logo/brand-system/01_심볼단독.svg">
  <link rel="stylesheet" href="../07_디자인/tokens/tokens.css">

  <script src="../07_디자인/_app-theme.js"></script>
  <link rel="stylesheet" href="patient.css">
  <script src="../07_디자인/_iconify-icon.min.js"></script>

  <style>
    body {
      background: var(--color-danger-soft);              /* 긴급 경고 톤, 이 화면만 빨강 배경 */
    }
    html { background: var(--color-danger-soft); }

    .p-header { padding-right: 20px; }
    .p-back { color: var(--color-danger); }
    .p-back iconify-icon { color: var(--color-danger); }

    /* 기본 SOS FAB은 이 화면에선 불필요 — 이미 SOS 상태 */
    .sos-fab { display: none; }

    .main {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: var(--space-6);
      min-height: 0;
      text-align: center;
    }

    /* ── 경고 히어로 원 ─────────────────────────── */
    .hero {
      width: 196px; height: 196px;
      border-radius: 50%;
      background: var(--color-danger);
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      box-shadow: 0 16px 44px rgba(220, 38, 38, 0.45);
      animation: sos-pulse-big 1.6s var(--easing-standard) infinite;
      flex-shrink: 0;
    }
    .hero iconify-icon { font-size: 100px; }
    @keyframes sos-pulse-big {
      0%, 100% { box-shadow: 0 16px 44px rgba(220, 38, 38, 0.45); transform: scale(1); }
      50%      { box-shadow: 0 16px 60px rgba(220, 38, 38, 0.65), 0 0 0 16px rgba(220, 38, 38, 0.12); transform: scale(1.04); }
    }

    .hero-heading h1 {
      font: var(--weight-bold) 52px / 1.1 var(--font-family-base);
      letter-spacing: -0.04em;
      color: var(--color-danger);
    }
    .hero-heading p {
      font: var(--weight-medium) 22px / 1.4 var(--font-family-base);
      color: var(--color-text-primary);
      margin-top: 12px;
      max-width: 640px;
    }

    /* ── 카운트다운 + 안내 카드 ─────────────────── */
    .count-card {
      background: var(--color-bg-surface);
      border-radius: 28px;
      padding: var(--space-6) var(--space-7);
      display: grid;
      grid-template-columns: 130px 1fr;
      align-items: center;
      gap: var(--space-6);
      width: 100%; max-width: 720px;
      box-shadow: 0 10px 36px rgba(220, 38, 38, 0.18);
      border: 1px solid rgba(220, 38, 38, 0.25);
    }
    .count-ring {
      position: relative;
      width: 130px; height: 130px;
      flex-shrink: 0;
    }
    .count-ring svg {
      width: 100%; height: 100%;
      transform: rotate(-90deg);
    }
    .count-ring .track {
      fill: none;
      stroke: rgba(220, 38, 38, 0.14);
      stroke-width: 12;
    }
    .count-ring .fill {
      fill: none;
      stroke: var(--color-danger);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-dasharray: 377;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }
    .count-num {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font: var(--weight-bold) 60px / 1 var(--font-family-base);
      color: var(--color-danger);
      letter-spacing: -0.04em;
    }
    .count-text {
      text-align: left;
    }
    .count-text .big {
      font: var(--weight-bold) 26px / 1.25 var(--font-family-base);
      letter-spacing: -0.3px;
    }
    .count-text .items {
      margin-top: 10px;
      display: flex; flex-direction: column; gap: 6px;
      font: var(--weight-medium) 18px / 1.4 var(--font-family-base);
      color: var(--color-text-secondary);
    }
    .count-text .items div { display: flex; align-items: center; gap: 8px; }
    .count-text .items iconify-icon { color: var(--color-danger); }

    /* ── 취소 + 즉시 실행 버튼들 ─────────────────── */
    .actions {
      width: 100%; max-width: 720px;
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-4);
    }
    .cancel-big {
      height: 112px;
      border: 0; cursor: pointer;
      border-radius: 24px;
      background: var(--color-bg-surface);
      color: var(--color-text-primary);
      display: flex; align-items: center; justify-content: center; gap: 14px;
      font: var(--weight-bold) 28px / 1 var(--font-family-base);
      letter-spacing: -0.3px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      transition: transform .15s, box-shadow .15s;
    }
    .cancel-big:hover { box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16); }
    .cancel-big:active { transform: scale(.97); }

    .quick-row {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: var(--space-4);
    }
    .quick-btn {
      height: 80px;
      border: 0; cursor: pointer;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font: var(--weight-bold) 22px / 1 var(--font-family-base);
      letter-spacing: -0.3px;
      text-decoration: none;
      transition: transform .15s;
    }
    .quick-btn:active { transform: scale(.97); }
    .quick-btn--119 {
      background: var(--color-danger);
      color: #fff;
      box-shadow: 0 8px 22px rgba(220, 38, 38, 0.4);
    }
    .quick-btn--fam {
      background: var(--color-bg-surface);
      color: var(--color-danger);
      border: 1.5px solid rgba(220, 38, 38, 0.3);
    }

    @media (max-width: 820px) {
      .hero { width: 140px; height: 140px; }
      .hero iconify-icon { font-size: 72px; }
      .hero-heading h1 { font-size: 36px; }
      .hero-heading p { font-size: 18px; }
      .count-card { grid-template-columns: 1fr; text-align: center; padding: var(--space-5); }
      .count-text { text-align: center; }
      .count-text .items div { justify-content: center; }
      .count-ring { margin: 0 auto; }
      .cancel-big { height: 92px; font-size: 24px; }
      .quick-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="app">

    <header class="p-header">
      <a href="p01-today.html" class="p-back" aria-label="닫기">
        <iconify-icon icon="fluent:dismiss-24-filled" width="28" aria-hidden="true"></iconify-icon>
        닫기
      </a>
      <div class="clock">
        <span class="clock-time" style="font-size: 36px; color: var(--color-danger);">오후 2:30</span>
      </div>
    </header>

    <div class="main">

      <div class="hero" aria-hidden="true">
        <iconify-icon icon="fluent:alert-urgent-24-filled"></iconify-icon>
      </div>

      <div class="hero-heading">
        <h1>긴급 도움 요청</h1>
        <p>실수가 아니라면 그대로 두세요. 잠시 뒤 119와 가족에게 동시에 연락이 갑니다.</p>
      </div>

      <section class="count-card" aria-label="긴급 카운트다운">
        <div class="count-ring" aria-hidden="true">
          <svg viewBox="0 0 140 140">
            <circle class="track" cx="70" cy="70" r="60"></circle>
            <circle class="fill" id="ringFill" cx="70" cy="70" r="60"></circle>
          </svg>
          <div class="count-num" id="countNum">5</div>
        </div>
        <div class="count-text">
          <div class="big">5초 뒤 자동으로 실행됩니다</div>
          <div class="items">
            <div>
              <iconify-icon icon="fluent:call-24-filled" width="20" aria-hidden="true"></iconify-icon>
              119 응급 전화 자동 연결
            </div>
            <div>
              <iconify-icon icon="fluent:people-community-24-filled" width="20" aria-hidden="true"></iconify-icon>
              민지 · 서연 · 태우에게 위치 공유
            </div>
            <div>
              <iconify-icon icon="fluent:location-24-filled" width="20" aria-hidden="true"></iconify-icon>
              현재 위치: 집 (거실)
            </div>
          </div>
        </div>
      </section>

      <div class="actions">
        <button class="cancel-big" type="button" id="cancelBtn" aria-label="긴급 호출 취소 — 홈으로 돌아갑니다">
          <iconify-icon icon="fluent:dismiss-circle-24-filled" width="36" aria-hidden="true"></iconify-icon>
          실수예요, 취소할게요
        </button>
        <div class="quick-row">
          <a href="#" class="quick-btn quick-btn--119" aria-label="119 바로 전화">
            <iconify-icon icon="fluent:call-24-filled" width="26" aria-hidden="true"></iconify-icon>
            119 바로 전화
          </a>
          <a href="p03-call.html" class="quick-btn quick-btn--fam" aria-label="119 대신 가족에게만 연락">
            <iconify-icon icon="fluent:people-24-filled" width="26" aria-hidden="true"></iconify-icon>
            가족에게만 연락
          </a>
        </div>
      </div>

    </div>
  </div>

  <script>
    // v3.2.4 P6 5중 표현 — 진입 즉시 진동 패턴 (긴-짧-짧 반복, 청각 손실 사용자 대비)
    if (navigator.vibrate) {
      // [진동, 멈춤, 진동, 멈춤, ...] — 긴-짧-짧 패턴 3회 반복
      navigator.vibrate([400, 100, 150, 100, 150, 400, 100, 150, 100, 150, 400, 100, 150, 100, 150]);
    }
    // FCM 표준 사운드는 PWA 자체에서 재생 불가 (서비스 워커 푸시 시 OS가 처리).
    // 화면 내 시각 강조는 빨강 + 사이렌 아이콘 + "긴급" 텍스트로 이미 3중 + 진동 + (푸시 사운드)

    (function () {
      var CIRCUMFERENCE = 377;
      var total = 5;
      var remain = total;
      var numEl = document.getElementById('countNum');
      var ringEl = document.getElementById('ringFill');
      var cancelBtn = document.getElementById('cancelBtn');
      var timer = null;
      var cancelled = false;

      function tick() {
        remain -= 1;
        if (cancelled) return;
        if (remain <= 0) {
          numEl.textContent = '연결 중';
          numEl.style.fontSize = '22px';
          ringEl.style.strokeDashoffset = CIRCUMFERENCE;
          return;
        }
        numEl.textContent = remain;
        var ratio = (total - remain) / total;
        ringEl.style.strokeDashoffset = (CIRCUMFERENCE * ratio).toFixed(1);
        timer = setTimeout(tick, 1000);
      }
      timer = setTimeout(tick, 1000);

      cancelBtn.addEventListener('click', function () {
        cancelled = true;
        if (timer) clearTimeout(timer);
        location.href = 'p01-today.html';
      });
    })();
  </script>

</body>
</html>
