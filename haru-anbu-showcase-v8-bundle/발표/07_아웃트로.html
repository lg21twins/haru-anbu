<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하루안부 — 아웃트로 16:9</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --blue:#2C7AFC;
    --ink:#1C1C1E;
    --muted:#8C939A;
    --bg:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box}

  html,body{
    width:100%;height:100%;
    background:#000;            /* 16:9 레터박스 영역 */
    font-family:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ── 16:9 무대 ── 화면에 꽉 차게 맞추되 비율 고정 */
  .stage-wrap{
    position:fixed;inset:0;
    display:grid;place-items:center;
  }
  .stage{
    position:relative;
    width:min(100vw, calc(100vh * 16 / 9));
    height:min(100vh, calc(100vw * 9 / 16));
    background:var(--bg);
    overflow:hidden;
  }

  /* ── 중앙 콘텐츠 ── 위계는 크기·간격·색으로만 */
  .lockup{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;
  }

  /* 심볼 */
  .symbol{
    width:clamp(64px, 12vw, 168px);
    height:auto;
    opacity:0;
    transform:translateY(14px) scale(.96);
    animation:rise .9s cubic-bezier(.22,.61,.36,1) .15s forwards;
  }

  /* 워드마크 */
  .wordmark{
    margin-top:clamp(22px,3.2vw,44px);
    font-weight:700;
    font-size:clamp(34px,5.2vw,72px);
    letter-spacing:-0.04em;
    color:var(--ink);
    opacity:0;
    transform:translateY(14px);
    animation:rise .9s cubic-bezier(.22,.61,.36,1) .55s forwards;
  }

  /* 슬로건 — 콤마 뒤 호흡 */
  .slogan{
    margin-top:clamp(2px,0.4vw,6px);
    font-weight:400;
    font-size:clamp(15px,2.05vw,28px);
    letter-spacing:-0.01em;
    color:var(--muted);
    opacity:0;
    transform:translateY(10px);
    animation:rise 1s cubic-bezier(.22,.61,.36,1) 1.05s forwards;
  }
  .slogan b{ font-weight:600; color:#5A6470; }

  @keyframes rise{
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  /* 캡처/녹화용: ?still 붙이면 애니메이션 없이 최종 프레임 */
  :root.still .symbol,
  :root.still .wordmark,
  :root.still .slogan{ animation:none;opacity:1;transform:none; }
</style>
</head>
<body>
  <div class="stage-wrap">
    <div class="stage">
      <div class="lockup">
        <!-- 심볼: 하루안부 두 잎 -->
        <svg class="symbol" viewBox="0 0 2526 2526" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="하루안부 심볼">
          <path d="M2521.32 2506.66C1239.65 2657.48 1239.65 1895.6 1239.65 1279.34L2497.69 0.000170058C2518.68 494.198 2522.27 1157.92 1658.86 1262.48C2641.88 1314.25 2521.32 2101.84 2521.32 2506.66Z" fill="#2C7AFC"/>
          <path d="M4.6772 19.3353C1286.35 -131.481 1286.35 630.399 1286.35 1246.66L28.3145 2526C7.32194 2031.8 3.73014 1368.08 867.143 1263.52C-115.881 1211.75 4.6772 424.157 4.6772 19.3353Z" fill="#2C7AFC"/>
        </svg>

        <div class="wordmark">하루안부</div>
        <div class="slogan">오늘도<b>,</b> 안녕하셨습니다.</div>
      </div>
    </div>
  </div>

  <script>
    // URL에 ?still 이면 정지 최종 프레임(썸네일/캡처용)
    if (location.search.includes('still')) document.documentElement.classList.add('still');
  </script>
</body>
</html>
