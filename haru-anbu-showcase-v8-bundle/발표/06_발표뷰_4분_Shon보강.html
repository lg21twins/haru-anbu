<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="하루안부 대본">
<title>하루안부 발표 진행 뷰</title>
<style>
  :root{
    --blue:#2C7AFC; --ink:#1A1D23; --ink2:#3A4049; --mute:#8A9099;
    --line:#E9ECF0; --paper:#F6F8FA; --cloverbg:#EEF4FF; --shonbg:#F2F3F5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:#fff;color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  .top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .top h1{font-size:17px;font-weight:700;letter-spacing:-.02em}
  .top .meta{font-size:13px;color:var(--mute)}
  .legend{display:flex;gap:10px;margin-left:auto;font-size:12px;align-items:center;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:600}
  .chip.clover{color:var(--blue);background:var(--cloverbg)}
  .chip.shon{color:var(--ink);background:var(--shonbg)}
  .stopwatch{position:fixed;bottom:26px;right:26px;z-index:200;font-size:60px;font-weight:800;font-feature-settings:"tnum" 1;color:var(--mute);background:#fff;border:2px solid var(--line);border-radius:20px;padding:10px 30px;text-align:center;cursor:pointer;user-select:none;letter-spacing:.01em;box-shadow:0 10px 34px -10px rgba(0,0,0,.28);line-height:1.1}
  .stopwatch.running{color:#fff;background:#0A7D3C}
  .stopwatch::before{content:"발표 시간";display:block;font-size:13px;font-weight:700;letter-spacing:.04em;opacity:.65;margin-bottom:2px}
  .wrap{max-width:880px;margin:0 auto;padding:24px 24px 160px}
  .help{font-size:13px;color:var(--ink2);background:var(--paper);border-radius:10px;padding:12px 16px;margin-bottom:8px}
  .help b{color:var(--blue)}
  .stage{margin-top:34px}
  .stage-head{display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:2px solid var(--ink);margin-bottom:8px}
  .stage-no{font-size:13px;font-weight:700;color:var(--blue);letter-spacing:.04em;font-feature-settings:"tnum" 1}
  .stage-title{font-size:20px;font-weight:700;letter-spacing:-.02em}
  .stage-screen{font-size:13px;color:var(--mute);margin-left:auto;text-align:right;max-width:50%}
  .line{display:flex;gap:14px;padding:14px 12px;border-radius:12px;cursor:pointer;transition:background .12s}
  .line:hover{background:var(--paper)}
  .line.cur{background:#FFF7E6;box-shadow:inset 3px 0 0 #F0A000}
  .line.film{background:#F0FAF3;box-shadow:inset 3px 0 0 #0A7D3C}
  .line.film.cur{background:#FFF7E6;box-shadow:inset 3px 0 0 #F0A000}
  .line.film .say{color:var(--ink)}
  .badge{flex-shrink:0;width:118px}
  .who{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
  .who.clover{color:#fff;background:var(--blue)}
  .who.shon{color:#fff;background:var(--ink)}
  .act{display:block;margin-top:7px;font-size:12px;font-weight:600}
  .act.live{color:var(--mute)}
  .tag-add{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;color:#0A7D3C;background:#E6F6EC;padding:2px 8px;border-radius:999px}
  /* ▶ 음원 버튼은 화면에서 숨김(Enter 자동재생이 내부적으로 호출하므로 DOM은 유지) */
  .play{display:none}
  .play.playing{background:var(--ink)}
  .say{flex:1;min-width:0;font-size:21px;letter-spacing:-.01em;word-break:keep-all;line-height:1.5}
  .line.shon .say{color:var(--ink2)}
  .num{flex-shrink:0;width:26px;text-align:right;font-size:13px;color:var(--mute);font-feature-settings:"tnum" 1;padding-top:5px}
  @media (max-width:680px){ .badge{width:96px} .say{font-size:19px} .stage-screen{display:none} }
</style>
</head>
<body>
<div class="top">
  <h1>하루안부 발표 진행 뷰</h1>
  <span class="meta">Shon ↔ 네잎클로버 · 약 4분 + 실사 영상 (Shon 분량 보강 · 웹 구성 반영 2026-06-08)</span>
  <div class="legend">
    <span class="chip clover">네잎클로버 = 음원 ▶</span>
    <span class="chip shon">Shon = 직접</span>
  </div>
  <span class="stopwatch" id="stopwatch" title="첫 AI 음성부터 경과 시간 · 클릭하면 리셋">0:00</span>
</div>
<div class="wrap">
  <div class="help">
    파란 줄 = <b>네잎클로버 음원</b>(▶ 또는 사이트 점 버튼). 검은 줄 = <b>Shon 직접</b> 발화.<br>
    <b>Enter</b> = 한 줄씩 진행. 네잎클로버 줄은 음원 재생, <b>Shon(내가 말할) 줄에서도 멈춤</b>. <b>↑</b> = 이전 줄. 줄 <b>클릭</b> = 위치 지정.
  </div>
  <div id="list"></div>
</div>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
const C='clover', S='shon';
const STAGES = [
  { t:'인트로 — 팀 소개', screen:'화면: Hero "하루안부."', lines:[
    {w:S, text:"안녕하세요. 저희는 '노인과 바다 그리고 네잎클로버' 팀입니다. 그런데 오늘 발표는, 저희 팀의 한 멤버가 직접 맡습니다. 사람이 아니라 — 에이아이예요."},
    {w:C, clip:'01', text:"안녕하세요. 저는 네잎클로버입니다. 하루안부 안에서 일하는 이 팀의 에이아이예요. 우리가 만든 하루를, 제가 직접 안내하겠습니다."},
    {w:S, text:"네, 든든한 우리 팀 네잎클로버예요. 저는 옆에서 거들겠습니다. 그럼 네잎클로버, 시작해 줄래요?"},
  ]},
  { t:'Hero + Overview', screen:'화면: "하루안부." → "세 시선을 잇는 케어 커뮤니케이션 플랫폼"', lines:[
    {w:C, clip:'02', text:"하루안부. 환자, 케어팀, 보호자. 흩어진 세 시선을, 하루의 안부 한 줄로 잇는 케어 플랫폼입니다."},
    {w:S, text:"세 시선을, 다섯 개의 화면으로 연결합니다."},
    {w:S, text:"세 시선, 다섯 화면. 그럼 이게 왜 필요했는지부터 같이 볼까요?"},
  ]},
  { t:'Problem — 왜 지금인가', screen:'화면: "잘 계십니다. 아마도?" → 페인 채팅("그렇다면 왜, 모두가 불안할까요") → 고령화 차트', lines:[
    {w:C, clip:'04', text:"잘 계십니다… 아마도? 부모님 안부는, 매일 아침 가장 무거운 질문입니다."},
    {w:S, text:"아, 전화 한 통 끊고 나서도 늘 따라붙는 그 마음이죠. 저도 그래요."},
    {w:S, text:"어 그럼, 각 사용자들의 불편한 점을 알아볼까요?"},
    {persona:'보호자',   clip:'pain1', sec:'→ 페르소나 말풍선 (각자 목소리·자동 연결)', text:"오늘 밥은 잘 드셨는지 모르겠어요."},
    {persona:'요양보호사', clip:'pain2', text:"보호자 전화에 하루 두 시간을 써요."},
    {persona:'환자',     clip:'pain3', text:"자식들 걱정시키고 싶지 않아요."},
    {persona:'의료진',   clip:'pain4', text:"어르신 상태를 매번 따로 기록해요."},
    {persona:'보호자',   clip:'pain5', text:"멀리 있어서 자주 가보지도 못해요."},
  ]},
  { t:'Real Story — 실사 영상 ★신규', screen:'화면: real-film "화면 너머, 진짜 하루의 안부" — 스크롤하면 영상이 풀스크린으로 확대됨', lines:[
    {w:S, film:true, text:"여기서 실사 영상을 재생합니다 — 「화면 너머, 진짜 하루의 안부」. 목업이 아니라 실제로 하루안부를 쓰는 사람들의 장면입니다. 스크롤하면 영상이 풀스크린으로 커집니다. 내레이션 없이 영상으로 감상한 뒤, 다음으로 넘어갑니다."},
  ]},
  { t:'App-preview — 하나로 모으다', screen:'화면: 하루안부 중심으로 기능 칩(음성안부·복약·긴급호출·리포트)', lines:[
    {w:S, text:"그래서 이걸, 하루안부 하나에 다 모았어요. 음성 안부, 복약 알림, 긴급 호출, 활동 리포트까지 — 여기저기 흩어져 있던 걸, 앱 하나로 끝낸 겁니다."},
  ]},
  { t:'Direction — 방향', screen:'화면: "흩어진 세 시선을 한 하루로 잇습니다."', lines:[
    {w:S, text:"방향은 하나입니다. 흩어진 세 시선을, 한 하루로 잇습니다."},
  ]},
  { t:'Design — 브랜드 · 타이포 · 컬러 · 아이콘 · UI', screen:'화면: design — 로고→타이포→컬러→아이콘→UI킷, 음성 없이 Shon 직접 설명 · Enter로 블록 이동', lines:[
    {w:S, sec:'→ 블록 1 · Brand Mark (로고)', text:"디자인도 같은 약속을 따릅니다. 로고의 두 곡선은, 보호자와 환자, 그 사이를 잇는 케어팀이 한 점에서 만나는 모습이에요."},
    {w:S, sec:'→ 블록 2 · Typography', text:"글자체도 한 가족입니다. 프리텐다드로 한글·라틴·숫자를 쓰고, 중국어는 노토 산스로 자동 폴백돼 다국어 요양보호사도 또렷하게 읽습니다."},
    {w:S, sec:'→ 블록 3 · Color System', text:"보호자는 블루, 케어팀은 그린, 환자는 오렌지. 누구의 정보인지, 색으로 바로 보입니다."},
    {w:S, sec:'→ 블록 4 · Iconography', text:"아이콘도 한 벌로 통일했습니다. 플루언트 단색 아이콘으로, 안심지수부터 복약과 에스오에스까지 같은 결로 그렸습니다."},
    {w:S, sec:'→ 블록 5 · UI Kit (컴포넌트)', text:"그리고 이 약속들이, 실제 컴포넌트가 됩니다. 보호자앱의 모든 탭을, 같은 규칙 위에 쌓았습니다."},
    {w:S, add:true, text:"로고에서 시작한 약속이 — 글자, 색, 아이콘, 컴포넌트까지 하나로 쭉 이어지네요."},
  ]},
  { t:'Persona — 같은 하루, 세 시점', screen:'화면: (Design 뒤 Care Flow 플로우 비주얼 경유) persona-switch — 보호자/환자/케어팀 시점 전환', lines:[
    {w:S, text:"같은 하루가, 보는 자리에 따라 이렇게 달라져요. 보호자는 안심을 받고, 어르신은 버튼 하나로 안부를 전하고, 케어팀은 기록하는 순간 그게 곧 안부가 됩니다."},
  ]},
  { t:'Service — 여섯 가지 핵심 기능', screen:'화면: service-features — 섹션 전체 보여주며 한 번에 (개별 스크롤 없음)', lines:[
    {w:S, text:"어떤 화면을 열어도, 여섯 기능이 함께 작동합니다. 자동 리포트, 안심지수, 그리고 새벽 에스오에스는 평균 삼 분 안에 연결됩니다."},
    {w:S, add:true, text:"여섯 개가 다 같은 데이터 위에서 도는 거네요. 새벽 삼 분 응답은 특히, 급할 때 그 시간이 정말 크죠."},
  ]},
  { t:'Flagship — 특히 자신 있는 셋', screen:'화면: (Service 뒤 feature-bridge 비주얼 경유) flagship-features — 3컷 하나씩 스크롤 (AI요약→실시간동기화→의료통합)', lines:[
    {w:S, text:"그중 몇 가지는, 특히 자신 있습니다."},
    {w:C, clip:'12a', sec:'→ 컷 1 · AI Daily Summary (보호자)', text:"첫째, 에이아이 데일리 요약. 매일 아침, 어제의 부모님을 제가 한 장으로 정리해 보호자에게 전합니다."},
    {w:C, clip:'12b', sec:'→ 컷 2 · Realtime Sync', text:"둘째, 실시간 동기화입니다. 요양보호사가 체크리스트를 누르는 그 손짓이, 의료진을 거쳐 보호자 화면의 한 카드로 닿습니다. 전화 한 통 없이도, 세 시점이 같은 데이터 위에서 영 점 오 초 만에 만납니다."},
    {w:C, clip:'12c', sec:'→ 컷 3 · Medical Integration (웹+모바일)', text:"셋째, 의료 통합. 데스크의 웹과 회진의 모바일이, 같은 데이터 하나 위에서 만납니다."},
    {w:S, add:true, text:"이 셋이 사실상 하루안부의 심장이네요. 그럼 진짜로 작동하는지, 직접 한번 볼까요?"},
  ]},
  { t:'5앱 라이브 (시그니처)', screen:'화면: 보호자=#features "직접 만져봅니다"(탭 전환 체험) → 환자·요양보호사·의료진앱·의료진웹=features-by-role', lines:[
    {w:C, clip:'13', sec:'01 보호자 · Mobile', text:"먼저 보호자입니다. 매일 아침, 어제의 부모님이 한 카드로 도착합니다. 식사·복약·수면까지 제가 정리해, 출근길 오 초면 다 보시게 합니다."},
    {w:C, clip:'14', sec:'02 환자 · Tablet', text:"다음은 어르신입니다. 글자는 크게, 터치는 넓게. 복잡한 메뉴 없이, 큰 버튼 하나로 누구나 오 초 안에 도움을 청합니다."},
    {w:C, clip:'15', sec:'03 요양보호사 · Mobile', text:"이번엔 요양보호사입니다. 출근하자마자, 오늘 하루가 한 화면에 펼쳐집니다. 근무 진행률부터 다음 케어까지 남은 시간, 가장 먼저 봐야 할 어르신까지 — 따로 찾을 필요 없이 위에서부터 차례로 보입니다."},
    {w:S, text:"외국인 요양보호사도 많잖아요?"},
    {w:C, clip:'16', text:"한국어로 만든 이 화면이, 모국어로 그대로 동작합니다."},
    {w:C, clip:'17', sec:'04 의료진 앱 · Mobile', text:"네 번째는 의료진 앱입니다. 병동을 걸으면서, 처치부터 인계까지 — 기록은 한 손으로. 에스오에스엔 이 초 안에 위치와 바이탈이 잡힙니다."},
    {w:C, clip:'18', sec:'05 의료진 웹 · PC', text:"마지막은 의료진 웹입니다. 전체 환자를 한 화면에. 제가 이상 신호를 중요도 순으로 정렬해, 봐야 할 환자를 맨 위에 올려 드립니다."},
    {w:S, sec:'라이브 증명 (직접 탭!)', text:"그리고 — 이게 다 모형이 아니에요. 지금 이 자리에서, 직접 만지면 진짜 열립니다."},
  ]},
  { t:'Closing — 마무리', screen:'화면: (5앱 뒤 moments 갤러리 경유) closing — "오늘 하루도, 안녕하셨습니다."', lines:[
    {w:C, clip:'20', text:"매일 잊지 않고 안부를 묻는 마음. 그 마음을 한 화면에 옮긴 것이, 하루안부입니다."},
    {w:C, clip:'21', text:"오늘 하루도, 안녕하셨습니다."},
  ]},
  { t:'송별', screen:'화면: closing 유지', lines:[
    {w:S, text:"저희 '노인과 바다 그리고 네잎클로버'의 하루안부였습니다. 감사합니다. 궁금하신 점은 사이트에서 직접 둘러보실 수 있어요."},
  ]},
];

const fmt = t => t.replace(/([.?!])\s+/g, '$1<br>');
const list = document.getElementById('list');
const rows = [];
let visNo = 0;
STAGES.forEach((st)=>{
  const stage = document.createElement('section'); stage.className='stage';
  visNo++;
  const head = document.createElement('div'); head.className='stage-head';
  head.innerHTML = `<span class="stage-no">STAGE ${visNo}</span><span class="stage-title">${st.t}</span><span class="stage-screen">${st.screen}</span>`;
  stage.appendChild(head);
  st.lines.forEach(l=>{
    const row = document.createElement('div');
    const isAudio = (l.w===C) || l.persona;   // 네잎클로버 + 페르소나(각자 목소리) = 음원 줄
    row.className = 'line ' + (l.film ? 'shon film' : (isAudio ? 'clover' : 'shon'));
    const idx = rows.length;
    const who = l.film ? '영상' : (l.persona ? l.persona : (l.w===C ? '네잎클로버' : 'Shon'));
    let badge = `<span class="who ${isAudio?'clover':'shon'}">${who}</span>`;
    badge += l.film ? `<span class="act" style="color:#0A7D3C;font-weight:700">▶ 실사 영상 재생</span>`
                    : (isAudio ? `<button class="play" data-clip="${l.clip}">▶ 음원 ${l.clip}</button>` : `<span class="act live">직접 말하기</span>${l.add ? `<span class="tag-add">추가</span>` : ''}`);
    const secTag = l.sec ? `<div style="font-size:12px;font-weight:700;color:var(--blue);margin-bottom:4px">${l.sec}</div>` : '';
    row.innerHTML = `<div class="num">${idx+1}</div><div class="badge">${badge}</div><div class="say">${secTag}${fmt(l.text)}</div>`;
    row.addEventListener('click', (e)=>{ if(e.target.closest('.play')) return; setCurrent(idx); });
    stage.appendChild(row);
    rows.push({el:row, line:l});
  });
  list.appendChild(stage);
});

let current=null, curIdx=-1;
function stopAudio(){ if(current){ current.audio.pause(); current.btn.classList.remove('playing'); current.btn.textContent='▶ 음원 '+current.clip; current=null; } }
// ── 스톱워치: 첫 AI 음성 시작 시 작동, 클릭/리셋 신호로 0 ──
var swStart=null, swTimer=null;
function fmtSW(ms){var s=Math.floor(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function startStopwatch(){ if(swStart!=null)return; swStart=Date.now(); var el=document.getElementById("stopwatch"); if(el)el.classList.add("running"); swTimer=setInterval(function(){var e=document.getElementById("stopwatch"); if(e)e.textContent=fmtSW(Date.now()-swStart);},200); }
function resetStopwatch(){ if(swTimer){clearInterval(swTimer);swTimer=null;} swStart=null; var el=document.getElementById("stopwatch"); if(el){el.textContent="0:00";el.classList.remove("running");} }
(function(){var el=document.getElementById("stopwatch"); if(el)el.addEventListener("click",resetStopwatch);})();
function playClip(btn){
  startStopwatch();
  const clip=btn.dataset.clip;
  if(current&&current.btn===btn){ stopAudio(); return; }
  stopAudio();
  const audio=new Audio(`audio/clover/clover-${clip}.mp3?v=20260605c`); audio.playbackRate=1.15;
  current={audio,btn,clip};
  btn.classList.add('playing'); btn.textContent='■ 정지 '+clip;
  audio.play().catch(err=>{ const h=document.querySelector('.help'); if(h){ h.style.color='#C0392B'; h.innerHTML='<b>소리가 막혔어요</b> — 페이지를 한 번 클릭한 뒤 다시 Enter를 누르세요. (브라우저 자동재생 차단)'; } });
  audio.addEventListener('ended', ()=>{ if(current&&current.btn===btn) stopAudio(); });
}
document.querySelectorAll('.play').forEach(b=> b.addEventListener('click', ()=>playClip(b)) );
function setCurrent(idx, autoplay){
  if(idx<0||idx>=rows.length) return;
  rows.forEach(r=>r.el.classList.remove('cur'));
  curIdx=idx; const r=rows[idx];
  r.el.classList.add('cur'); r.el.scrollIntoView({behavior:'smooth',block:'center'});
  if(autoplay && (r.line.w===C || r.line.persona)){ const btn=r.el.querySelector('.play'); if(btn) playClip(btn); }
}
function nextClover(from){ for(let i=from;i<rows.length;i++){ if(rows[i].line.w===C) return i; } return -1; }
function prevClover(from){ for(let i=from;i>=0;i--){ if(rows[i].line.w===C) return i; } return -1; }
document.addEventListener('keydown',(e)=>{
  // 한 줄씩 진행 — 네잎클로버 줄이면 음원 재생, Shon(내가 말할) 줄이면 멈추기만
  if(e.key==='Enter'||e.key==='ArrowDown'||e.key===' '){ e.preventDefault(); if(curIdx+1<rows.length) setCurrent(curIdx+1,true); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); stopAudio(); if(curIdx-1>=0) setCurrent(curIdx-1,false); }
});

/* ── 발표 동기화 (Follower) — 노트북 쇼케이스가 재생 중인 클립을 따라 자동 하이라이트+스크롤.
      URL ?sync=<토큰> 있을 때만 작동. 아이패드는 소리 안 냄(노트북만 재생). 끊겨도 Enter/클릭 수동 가능. ── */
(function(){
  var token = new URLSearchParams(location.search).get('sync');
  if(!token) return;
  var dot = document.createElement('div');
  dot.style.cssText = 'position:fixed;bottom:26px;left:26px;z-index:99;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:#EEE;color:#888;box-shadow:0 2px 12px -4px rgba(0,0,0,.25)';
  dot.textContent = '○ 동기화 연결 중…';
  document.body.appendChild(dot);
  if(typeof mqtt === 'undefined'){ dot.textContent = '동기화 불가 (네트워크)'; return; }
  var map = {};
  rows.forEach(function(r,i){ if(r.line.clip!=null) map[r.line.clip] = i; });   // 네잎클로버 + 페르소나(pain) 클립 모두 매핑
  var topic = 'haruanbu/present/' + token, client;
  try { client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {reconnectPeriod:2000, connectTimeout:8000}); }
  catch(e){ dot.textContent = '동기화 불가'; return; }
  client.on('connect', function(){
    dot.textContent = '● 동기화됨'; dot.style.background = '#E6F7EC'; dot.style.color = '#1B8A4B';
    client.subscribe(topic);
  });
  client.on('reconnect', function(){ dot.textContent = '○ 재연결 중…'; dot.style.background = '#FFF7E6'; dot.style.color = '#A86B00'; });
  client.on('close', function(){ dot.textContent = '○ 끊김 (Enter로 수동)'; dot.style.background = '#FDECEA'; dot.style.color = '#C0392B'; });
  client.on('error', function(){});
  client.on('message', function(t, payload){
    try {
      var d = JSON.parse(payload.toString());
      if(d.reset){ stopAudio(); setCurrent(0, false); resetStopwatch(); return; }   // 발표 처음으로 → 진행뷰도 첫 줄로
      if(d.clip != null && map[d.clip] != null){ startStopwatch(); setCurrent(map[d.clip], false); }
    } catch(e){}
  });
})();
</script>
