<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하루안부 — 재추출 11개 (TTS 복붙용)</title>
<style>
  :root{ --blue:#2C7AFC; --ink:#1A1D23; --mute:#8A9099; --line:#ECEEF1; --paper:#F7F8FA; --new:#0A7D3C; --newbg:#E6F6EC; --ovr:#B26A00; --ovrbg:#FBF1E0; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:#fff;color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:48px 24px 120px}
  header{margin-bottom:32px}
  h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
  .sub{font-size:14px;color:var(--mute);margin-top:8px}
  .hint{font-size:13px;color:var(--mute);margin-top:16px;padding:12px 16px;background:var(--paper);border-radius:10px}
  .hint b{color:var(--ink)}
  .row{display:flex;gap:14px;align-items:flex-start;padding:18px 0;border-bottom:1px solid var(--line)}
  .meta{flex-shrink:0;width:128px;padding-top:2px}
  .file{font-size:13px;font-weight:700;color:var(--ink);font-feature-settings:"tnum" 1;word-break:break-all}
  .tag{display:inline-block;font-size:11px;font-weight:700;margin-top:6px;padding:2px 8px;border-radius:999px}
  .tag.new{color:var(--new);background:var(--newbg)}
  .tag.ovr{color:var(--ovr);background:var(--ovrbg)}
  .sec{display:block;font-size:11px;color:var(--mute);margin-top:6px}
  .body{flex:1;min-width:0}
  .text{font-size:16px;letter-spacing:-.01em;white-space:pre-wrap;word-break:keep-all}
  .copy{margin-top:10px;font:inherit;font-size:13px;font-weight:600;color:var(--blue);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;transition:background .12s,color .12s}
  .copy:hover{background:var(--paper)}
  .copy.done{color:#fff;background:var(--blue);border-color:var(--blue)}
  .grp{margin:34px 0 4px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>하루안부 — 재추출 11개 (TTS 복붙용)</h1>
    <p class="sub">전부 네잎클로버 보이스 · 발표 순서. 각 줄을 일레븐랩스에 붙여 뽑고, <b>표시된 파일명</b>으로 <code>발표/audio/clover/</code>에 저장.</p>
    <div class="hint">
      <span style="color:var(--new);font-weight:700">새 파일 6개</span> = 폴더에 없음(신규 생성) · <span style="color:var(--ovr);font-weight:700">덮어쓰기 5개</span> = 기존 mp3 있지만 대사 바뀜(다시 뽑아 덮어쓰기).<br>
      약어는 한국어 발음(에스오에스·에이아이) · 숫자 풀어 읽기 적용됨. 나머지 13개(01·02·03·04·05·07·08·09·11·16·19·20·21)는 그대로 재사용.
    </div>
  </header>
  <div id="list"></div>
</div>
<script>
// [파일ID, 종류(new|ovr), 섹션, 대사]
const LINES = [
 ["clover-08t","new","Design · ② Typography","글자체도 한 가족입니다. 프리텐다드로 한글·라틴·숫자를 쓰고, 중국어는 노토 산스로 자동 폴백돼 다국어 요양보호사도 또렷하게 읽습니다."],
 ["clover-09i","new","Design · ④ Iconography","아이콘도 한 벌로 통일했습니다. 플루언트 단색 아이콘으로, 안심지수부터 복약과 에스오에스까지 같은 결로 그렸습니다."],
 ["clover-09u","new","Design · ⑤ UI Kit","그리고 이 약속들이, 실제 컴포넌트가 됩니다. 보호자앱의 모든 탭을, 같은 규칙 위에 쌓았습니다."],
 ["clover-12a","new","Flagship · 컷1 AI Daily Summary","첫째, 에이아이 데일리 요약. 매일 아침, 어제의 부모님을 제가 한 장으로 정리해 보호자에게 전합니다."],
 ["clover-12b","new","Flagship · 컷2 Realtime Sync","둘째, 실시간 동기화입니다. 요양보호사가 체크리스트를 누르는 그 손짓이, 의료진의 확인을 거쳐 보호자 화면의 한 카드로 닿습니다. 전화 한 통, 메모 한 줄 없이도 어제의 부모님이 보이고 — 세 시점이 같은 데이터 위에서, 영 점 오 초 만에 실시간으로 만납니다."],
 ["clover-12c","new","Flagship · 컷3 Medical Integration","셋째, 의료 통합. 데스크의 웹과 회진의 모바일이, 같은 데이터 하나 위에서 만납니다."],
 ["clover-13","ovr","5앱 · ① 보호자","먼저 보호자입니다. 매일 아침, 어제의 부모님이 한 카드로 도착합니다. 식사·복약·수면까지 제가 정리해, 출근길 오 초면 다 보시게 합니다."],
 ["clover-14","ovr","5앱 · ② 환자","다음은 어르신입니다. 글자는 크게, 터치는 넓게. 복잡한 메뉴 없이, 큰 버튼 하나로 누구나 오 초 안에 도움을 청합니다."],
 ["clover-15","ovr","5앱 · ③ 요양보호사","이번엔 요양보호사입니다. 출근하자마자, 오늘 하루가 한 화면에 펼쳐집니다. 근무 진행률부터 다음 케어까지 남은 시간, 가장 먼저 봐야 할 어르신까지 — 따로 찾을 필요 없이 위에서부터 차례로 보입니다."],
 ["clover-17","ovr","5앱 · ④ 의료진 앱","네 번째는 의료진 앱입니다. 병동을 걸으면서, 처치부터 인계까지 — 기록은 한 손으로. 에스오에스엔 이 초 안에 위치와 바이탈이 잡힙니다."],
 ["clover-18","ovr","5앱 · ⑤ 의료진 웹","마지막은 의료진 웹입니다. 전체 환자를 한 화면에. 제가 이상 신호를 중요도 순으로 정렬해, 봐야 할 환자를 맨 위에 올려 드립니다."],
];
const list = document.getElementById('list');
LINES.forEach((l)=>{
  const [file,kind,sec,text]=l;
  const row=document.createElement('div'); row.className='row';
  const tagLabel = kind==='new' ? '새 파일' : '덮어쓰기';
  row.innerHTML=`<div class="meta"><div class="file">${file}.mp3</div><span class="tag ${kind}">${tagLabel}</span><span class="sec">${sec}</span></div>`+
    `<div class="body"><div class="text"></div><button class="copy">복사</button></div>`;
  const broken=text.replace(/([.?!])\s+/g,'$1\n');
  row.querySelector('.text').textContent=broken;
  const btn=row.querySelector('.copy');
  btn.addEventListener('click',()=>{
    navigator.clipboard.writeText(text).then(()=>{
      btn.textContent='복사됨'; btn.classList.add('done');
      setTimeout(()=>{btn.textContent='복사'; btn.classList.remove('done');},1200);
    });
  });
  list.appendChild(row);
});
</script>
</body>
</html>
